  <style>
    :root{--primary:#bf6a8a;--primary-dark:#9c4f6e}
    .sub-page{max-width:720px;margin:0 auto;padding:0 0 40px}
    .sub-hero{background:linear-gradient(135deg,#bf6a8add,#9c4f6e99);padding:24px 16px 20px;color:#fff;text-align:center}
    .sub-hero-badge{display:inline-block;background:rgba(255,255,255,0.2);padding:4px 12px;border-radius:12px;font-size:12px;margin-bottom:8px;backdrop-filter:blur(4px)}
    .sub-hero h1{font-size:22px;font-weight:700;margin:6px 0 8px;display:flex;align-items:center;justify-content:center;gap:8px}
    .sub-hero h1 .hero-icon{font-size:32px}
    .sub-hero p{font-size:14px;opacity:0.9;line-height:1.6;max-width:480px;margin:0 auto}
    .sub-body{padding:16px}
    .sub-block{margin-bottom:20px}
    .sub-sec-ttl{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:6px;color:var(--text)}
    .sub-more{font-size:12px;font-weight:400;color:var(--text-muted);margin-left:auto}
    .sub-third{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .sub-third-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:transform .15s,box-shadow .15s}
    .sub-third-card:active{transform:scale(0.96)}
    .sti{font-size:28px}
    .stn{font-size:12px;color:var(--text);text-align:center;line-height:1.3}
    .sub-feat{display:flex;flex-direction:column;gap:8px}
    .sub-feat-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:background .15s}
    .sub-feat-card:active{background:var(--bg-hover)}
    .sf-ic{font-size:24px;flex-shrink:0}
    .sf-bd{flex:1;min-width:0}
    .sf-t{font-size:14px;font-weight:600;color:var(--text);display:block}
    .sf-d{font-size:12px;color:var(--text-muted);display:block;margin-top:2px}
    .sf-ar{font-size:20px;color:var(--text-muted);flex-shrink:0}
    .sub-arts{display:flex;flex-direction:column;gap:8px}
    .sub-art{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:background .15s}
    .sub-art:active{background:var(--bg-hover)}
    .sa-t{font-size:14px;font-weight:600;color:var(--text);line-height:1.4}
    .sa-m{font-size:12px;color:var(--text-muted)}
    .sub-empty{text-align:center;padding:20px;color:var(--text-muted);font-size:13px}
    .sub-back{display:inline-block;padding:10px 20px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;margin-top:12px}
    .sub-crumb{padding:12px 16px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--bg-alt)}
    .sub-crumb a{color:var(--primary);text-decoration:none;font-weight:500}
    .sub-crumb b{color:var(--text);font-weight:600}
    .sub-crumb .sep{color:var(--text-muted)}
  </style>
</head>
