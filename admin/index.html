<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iHangzhou 管理面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #1f2937; line-height: 1.6; }
    .header { background: linear-gradient(135deg, #1b4d3e, #0ea5e9); color: #fff; padding: 20px 24px; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 8px 18px; border: none; background: #e5e7eb; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .2s; }
    .tab-btn.active { background: #0ea5e9; color: #fff; }
    .tab-btn:hover:not(.active) { background: #d1d5db; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* 统计面板 */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .stat-card .label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #111827; }
    .stat-card .delta { font-size: 12px; margin-top: 4px; }
    .stat-card .delta.up { color: #10b981; }
    .stat-card .delta.down { color: #ef4444; }
    .chart-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .chart-card h3 { font-size: 15px; margin-bottom: 12px; color: #111827; }
    .trend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .trend-row .date { font-size: 12px; color: #6b7280; width: 80px; flex-shrink: 0; }
    .trend-row .bar-wrap { flex: 1; height: 20px; background: #f3f4f6; border-radius: 4px; overflow: hidden; display: flex; }
    .trend-row .bar { height: 100%; background: #0ea5e9; border-radius: 4px; transition: width .3s; }
    .trend-row .bar.click { background: #10b981; }
    .trend-row .bar.uv { background: #8b5cf6; }
    .trend-row .count { font-size: 12px; color: #374151; width: 60px; text-align: right; }
    .rank-list { list-style: none; }
    .rank-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
    .rank-list li:last-child { border-bottom: none; }
    .rank-list .rank-num { width: 20px; height: 20px; background: #e5e7eb; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #374151; }
    .rank-list li:nth-child(1) .rank-num { background: #fbbf24; color: #92400e; }
    .rank-list li:nth-child(2) .rank-num { background: #d1d5db; color: #1f2937; }
    .rank-list li:nth-child(3) .rank-num { background: #fdba74; color: #9a3412; }
    .rank-list .name { flex: 1; font-size: 13px; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-list .count { font-size: 13px; font-weight: 600; color: #6b7280; }

    /* 关键词管理 */
    .toolbar { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .toolbar input, .toolbar select, .toolbar button { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .toolbar input { flex: 1; min-width: 180px; }
    .toolbar input:focus { outline: none; border-color: #0ea5e9; }
    .toolbar button { background: #0ea5e9; color: #fff; border: none; cursor: pointer; font-weight: 500; }
    .toolbar button:hover { background: #0284c7; }
    .toolbar button.danger { background: #ef4444; }
    .toolbar button.danger:hover { background: #dc2626; }
    .toolbar button.success { background: #10b981; }
    .kw-table { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .kw-table-header, .kw-row { display: grid; grid-template-columns: 1.2fr 1.5fr 0.8fr 2fr 0.8fr; gap: 10px; padding: 10px 16px; align-items: center; }
    .kw-table-header { background: #f9fafb; font-size: 12px; font-weight: 600; color: #6b7280; border-bottom: 1px solid #e5e7eb; }
    .kw-row { border-bottom: 1px solid #f3f4f6; font-size: 13px; }
    .kw-row:hover { background: #f9fafb; }
    .kw-row:last-child { border-bottom: none; }
    .kw-row .keyword { font-weight: 600; color: #111827; }
    .kw-row .aliases { font-size: 11px; color: #6b7280; }
    .kw-row .type-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; background: #dbeafe; color: #1d4ed8; }
    .kw-row .type-badge.news { background: #fef3c7; color: #92400e; }
    .kw-row .reply { font-size: 12px; color: #4b5563; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kw-row .actions { display: flex; gap: 4px; }
    .kw-row .actions button { padding: 4px 8px; font-size: 11px; }
    .empty { text-align: center; padding: 40px 20px; color: #9ca3af; }

    /* 模态框 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 560px; max-height: 80vh; overflow-y: auto; }
    .modal h3 { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; font-size: 16px; }
    .modal .body { padding: 20px; }
    .modal .field { margin-bottom: 12px; }
    .modal .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #374151; }
    .modal .field input, .modal .field textarea, .modal .field select { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .modal .field textarea { resize: vertical; min-height: 60px; font-family: inherit; }
    .modal .field input:focus, .modal .field textarea:focus { outline: none; border-color: #0ea5e9; }
    .modal .footer { padding: 12px 20px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; justify-content: flex-end; }
    .modal .footer button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .modal .footer .cancel { background: #f3f4f6; color: #374151; }
    .modal .footer .save { background: #0ea5e9; color: #fff; }
    .toast-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 2000; display: none; }
    .toast-msg.show { display: block; }
    .auth-bar { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .auth-bar input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    .auth-bar button { padding: 10px 24px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>

<div class="header">
  <h1>🏔️ iHangzhou 管理面板</h1>
  <div class="subtitle">访问统计 · 关键词回复管理</div>
</div>

<div class="container">
  <!-- 认证 -->
  <div class="auth-bar" id="authBar">
    <input type="password" id="authToken" placeholder="请输入 CMS_ADMIN_PASSWORD">
    <button onclick="authenticate()">登录</button>
  </div>

  <!-- Tab 栏 -->
  <div class="tabs" id="tabs" style="display:none;">
    <button class="tab-btn active" data-tab="stats">📊 访问统计</button>
    <button class="tab-btn" data-tab="keywords">💬 关键词回复</button>
  </div>

  <!-- 统计面板 -->
  <div class="panel active" id="panelStats">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="chart-card">
      <h3>📈 近 30 天 PV / UV / 点击趋势</h3>
      <div id="trendChart"></div>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="chart-card">
        <h3>🔥 热门页面 Top 10</h3>
        <ul class="rank-list" id="topPages"></ul>
      </div>
      <div class="chart-card">
        <h3>🖱️ 热门点击 Top 10</h3>
        <ul class="rank-list" id="topClicks"></ul>
      </div>
    </div>
  </div>

  <!-- 关键词管理面板 -->
  <div class="panel" id="panelKeywords">
    <div class="toolbar">
      <input type="text" id="kwSearch" placeholder="搜索关键词..." oninput="filterKeywords()">
      <select id="kwTypeFilter" onchange="filterKeywords()">
        <option value="">全部类型</option>
        <option value="text">文字回复</option>
        <option value="news">图文回复</option>
      </select>
      <button class="success" onclick="openAddModal()">+ 批量新增</button>
      <button onclick="openImportModal()">📥 导入 JSON</button>
      <button onclick="exportKeywords()">📤 导出</button>
      <button class="danger" onclick="deleteSelected()">🗑️ 删除选中</button>
    </div>
    <div class="kw-table">
      <div class="kw-table-header">
        <div><input type="checkbox" id="selectAll" onchange="toggleAll()"></div>
        <div>关键词 / 别名</div>
        <div>类型</div>
        <div>回复内容</div>
        <div>操作</div>
      </div>
      <div id="kwList"></div>
    </div>
  </div>
</div>

<!-- 新增/编辑模态框 -->
<div class="modal-overlay" id="kwModal">
  <div class="modal">
    <h3 id="kwModalTitle">新增关键词</h3>
    <div class="body">
      <div class="field"><label>关键词 *</label><input id="kwKeyword" placeholder="用户触发词"></div>
      <div class="field"><label>别名（逗号分隔）</label><input id="kwAliases" placeholder="如：限号,尾号"></div>
      <div class="field"><label>回复类型</label>
        <select id="kwType" onchange="toggleTypeFields()">
          <option value="text">文字回复</option>
          <option value="news">图文回复</option>
        </select>
      </div>
      <div class="field" id="fieldReply"><label>回复内容</label><textarea id="kwReply" placeholder="纯文本，支持换行"></textarea></div>
      <div class="field" id="fieldTitle" style="display:none;"><label>图文标题 *</label><input id="kwTitle" placeholder="图文消息标题"></div>
      <div class="field" id="fieldDesc" style="display:none;"><label>图文描述</label><textarea id="kwDesc" placeholder="图文消息摘要"></textarea></div>
      <div class="field" id="fieldPicUrl" style="display:none;"><label>封面图 URL</label><input id="kwPicUrl" placeholder="https://..."></div>
      <div class="field" id="fieldUrl" style="display:none;"><label>跳转链接 *</label><input id="kwUrl" placeholder="https://..."></div>
    </div>
    <div class="footer">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="save" onclick="saveKeyword()">保存</button>
    </div>
  </div>
</div>

<!-- 批量导入模态框 -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h3>批量导入（JSON 格式）</h3>
    <div class="body">
      <div class="field"><label>JSON 数组</label><textarea id="importJson" style="min-height:150px; font-family:monospace; font-size:12px;" placeholder='[{"keyword":"新闻","type":"text","reply":"这是回复"}, ...]'></textarea></div>
      <p style="font-size:12px;color:#6b7280;margin-top:8px;">支持 add（追加）/ replace（全量替换）两种模式</p>
    </div>
    <div class="footer">
      <button class="cancel" onclick="closeImportModal()">取消</button>
      <button class="save" onclick="doImport('add')">追加导入</button>
      <button class="danger" onclick="doImport('replace')">全量替换</button>
    </div>
  </div>
</div>

<div class="toast-msg" id="toast"></div>

<script>
  var AUTH = '';
  var KEYWORDS = [];
  var editingKeyword = null;

  // ===== 认证 =====
  function authenticate() {
    var t = document.getElementById('authToken').value.trim();
    if (!t) { toast('请输入密码'); return; }
    AUTH = 'Bearer ' + t;
    document.getElementById('authBar').style.display = 'none';
    document.getElementById('tabs').style.display = 'flex';
    loadStats();
    loadKeywords();
  }

  // ===== Tab 切换 =====
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.onclick = function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel' + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.add('active');
    };
  });

  // ===== API 调用 =====
  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, { 'Authorization': AUTH, 'Content-Type': 'application/json' });
    var res = await fetch(path, opts);
    return res.json();
  }

  function toast(msg, ms) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, ms || 2500);
  }

  // ===== 统计 =====
  async function loadStats() {
    try {
      var r = await api('/api/tools?action=track&stats=1');
      if (!r.success) { toast('加载统计失败'); return; }
      renderStats(r.data);
    } catch (e) { toast('加载统计失败: ' + e.message); }
  }

  function renderStats(d) {
    // 核心数据卡
    var cards = [
      { label: '今日 PV', value: d.today.pv, delta: null },
      { label: '今日 UV', value: d.today.uv, delta: d.today.uvDelta },
      { label: '今日点击', value: d.today.clicks, delta: null },
      { label: '7 日 PV', value: d.trend7.pv, delta: d.trend7.pvDelta },
      { label: '7 日 UV', value: d.trend7.uv, delta: d.trend7.uvDelta },
      { label: '累计 PV', value: d.total.pv, delta: null },
      { label: '累计 UV', value: d.total.uv, delta: null },
      { label: '活跃 UV（7 日）', value: d.total.uv7, delta: null }
    ];
    document.getElementById('statsGrid').innerHTML = cards.map(function(c) {
      var deltaHtml = c.delta != null ? '<div class="delta ' + (c.delta >= 0 ? 'up' : 'down') + '">' + (c.delta >= 0 ? '↑' : '↓') + ' ' + Math.abs(c.delta) + '% vs 昨日</div>' : '';
      return '<div class="stat-card"><div class="label">' + c.label + '</div><div class="value">' + c.value.toLocaleString() + '</div>' + deltaHtml + '</div>';
    }).join('');

    // 趋势图
    if (d.days && d.days.length) {
      var maxPV = Math.max.apply(null, d.days.map(function(d) { return d.pv; }).concat([1]));
      document.getElementById('trendChart').innerHTML = d.days.slice(-14).map(function(d) {
        var barW = Math.round(d.pv / maxPV * 100);
        return '<div class="trend-row"><span class="date">' + d.date.slice(5) + '</span>' +
          '<div class="bar-wrap"><div class="bar" style="width:' + barW + '%"></div></div>' +
          '<span class="count">PV ' + d.pv + ' / UV ' + d.uv + '</span></div>';
      }).join('');
    }

    // 热门页面
    document.getElementById('topPages').innerHTML = d.topPages && d.topPages.length ? d.topPages.map(function(p, i) {
      return '<li><span class="rank-num">' + (i + 1) + '</span><span class="name" title="' + p.name + '">' + p.name + '</span><span class="count">' + p.count + '</span></li>';
    }).join('') : '<li class="empty">暂无数据</li>';

    // 热门点击
    document.getElementById('topClicks').innerHTML = d.topClicks && d.topClicks.length ? d.topClicks.map(function(c, i) {
      return '<li><span class="rank-num">' + (i + 1) + '</span><span class="name" title="' + c.name + '">' + c.name + '</span><span class="count">' + c.count + '</span></li>';
    }).join('') : '<li class="empty">暂无数据</li>';
  }

  // ===== 关键词 =====
  async function loadKeywords() {
    try {
      var r = await api('/api/tools?action=keywords');
      if (!r.success) { toast('加载关键词失败'); return; }
      KEYWORDS = r.data || [];
      filterKeywords();
    } catch (e) { toast('加载失败: ' + e.message); }
  }

  function filterKeywords() {
    var q = (document.getElementById('kwSearch').value || '').trim().toLowerCase();
    var t = document.getElementById('kwTypeFilter').value;
    var filtered = KEYWORDS.filter(function(k) {
      if (t && k.type !== t) return false;
      if (q && (k.keyword || '').toLowerCase().indexOf(q) < 0 &&
          !(k.aliases || []).some(function(a) { return a.toLowerCase().indexOf(q) >= 0; })) return false;
      return true;
    });
    renderKeywords(filtered);
  }

  function renderKeywords(list) {
    if (!list.length) { document.getElementById('kwList').innerHTML = '<div class="empty">无匹配关键词</div>'; return; }
    document.getElementById('kwList').innerHTML = list.map(function(k) {
      return '<div class="kw-row">' +
        '<div><input type="checkbox" class="kw-check" data-kw="' + k.keyword + '"></div>' +
        '<div><div class="keyword">' + escapeHtml(k.keyword) + '</div><div class="aliases">' + (k.aliases || []).join('、') + '</div></div>' +
        '<div><span class="type-badge ' + (k.type || 'text') + '">' + (k.type === 'news' ? '图文' : '文字') + '</span></div>' +
        '<div class="reply" title="' + escapeHtml(k.reply || k.title || '') + '">' + escapeHtml(k.reply || k.title || '') + '</div>' +
        '<div class="actions"><button onclick="editKeyword(\'' + escapeHtml(k.keyword) + '\')">编辑</button><button class="danger" onclick="deleteOne(\'' + escapeHtml(k.keyword) + '\')">删除</button></div>' +
      '</div>';
    }).join('');
  }

  function escapeHtml(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function toggleAll() {
    var checked = document.getElementById('selectAll').checked;
    document.querySelectorAll('.kw-check').forEach(function(c) { c.checked = checked; });
  }

  function openAddModal() {
    editingKeyword = null;
    document.getElementById('kwModalTitle').textContent = '新增关键词';
    document.getElementById('kwKeyword').value = '';
    document.getElementById('kwAliases').value = '';
    document.getElementById('kwType').value = 'text';
    document.getElementById('kwReply').value = '';
    document.getElementById('kwTitle').value = '';
    document.getElementById('kwDesc').value = '';
    document.getElementById('kwPicUrl').value = '';
    document.getElementById('kwUrl').value = '';
    toggleTypeFields();
    document.getElementById('kwModal').classList.add('active');
  }

  function editKeyword(kw) {
    var k = KEYWORDS.find(function(x) { return x.keyword === kw; });
    if (!k) return;
    editingKeyword = kw;
    document.getElementById('kwModalTitle').textContent = '编辑: ' + kw;
    document.getElementById('kwKeyword').value = k.keyword;
    document.getElementById('kwType').value = k.type || 'text';
    document.getElementById('kwAliases').value = (k.aliases || []).join(',');
    document.getElementById('kwReply').value = k.reply || '';
    document.getElementById('kwTitle').value = k.title || '';
    document.getElementById('kwDesc').value = k.desc || '';
    document.getElementById('kwPicUrl').value = k.picUrl || '';
    document.getElementById('kwUrl').value = k.url || '';
    toggleTypeFields();
    document.getElementById('kwModal').classList.add('active');
  }

  function toggleTypeFields() {
    var isNews = document.getElementById('kwType').value === 'news';
    document.getElementById('fieldReply').style.display = isNews ? 'none' : '';
    document.getElementById('fieldTitle').style.display = isNews ? '' : 'none';
    document.getElementById('fieldDesc').style.display = isNews ? '' : 'none';
    document.getElementById('fieldPicUrl').style.display = isNews ? '' : 'none';
    document.getElementById('fieldUrl').style.display = isNews ? '' : 'none';
  }

  function closeModal() { document.getElementById('kwModal').classList.remove('active'); }

  async function saveKeyword() {
    var kw = {
      keyword: document.getElementById('kwKeyword').value.trim(),
      aliases: (document.getElementById('kwAliases').value || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean),
      type: document.getElementById('kwType').value
    };
    if (!kw.keyword) { toast('关键词不能为空'); return; }
    if (kw.type === 'text') { kw.reply = document.getElementById('kwReply').value; }
    else {
      kw.title = document.getElementById('kwTitle').value.trim();
      kw.desc = document.getElementById('kwDesc').value;
      kw.picUrl = document.getElementById('kwPicUrl').value.trim();
      kw.url = document.getElementById('kwUrl').value.trim();
      if (!kw.title || !kw.url) { toast('图文类型需要标题和链接'); return; }
    }

    if (editingKeyword) {
      var r = await api('/api/tools?action=keywords', { method: 'POST', body: JSON.stringify({ update: [kw] }) });
      if (r.success && (!r.errors || !r.errors.length)) { toast('更新成功'); closeModal(); loadKeywords(); }
      else { toast((r.errors || ['更新失败']).join('; ')); }
    } else {
      var r = await api('/api/tools?action=keywords', { method: 'POST', body: JSON.stringify({ add: [kw] }) });
      if (r.success && (!r.errors || !r.errors.length)) { toast('新增成功'); closeModal(); loadKeywords(); }
      else { toast((r.errors || ['新增失败']).join('; ')); }
    }
  }

  function deleteSelected() {
    var kws = Array.prototype.map.call(document.querySelectorAll('.kw-check:checked'), function(c) { return c.dataset.kw; });
    if (!kws.length) { toast('请先选择'); return; }
    if (!confirm('确认删除选中的 ' + kws.length + ' 个关键词？')) return;
    api('/api/tools?action=keywords', { method: 'POST', body: JSON.stringify({ remove: kws }) }).then(function(r) {
      if (r.success) { toast('已删除 ' + kws.length + ' 个'); loadKeywords(); }
      else { toast('删除失败: ' + (r.error || '')); }
    });
  }

  function deleteOne(kw) {
    if (!confirm('确认删除「' + kw + '」？')) return;
    api('/api/tools?action=keywords', { method: 'POST', body: JSON.stringify({ remove: [kw] }) }).then(function(r) {
      if (r.success) { toast('已删除'); loadKeywords(); }
      else { toast('删除失败: ' + (r.error || '')); }
    });
  }

  function openImportModal() {
    document.getElementById('importJson').value = '';
    document.getElementById('importModal').classList.add('active');
  }
  function closeImportModal() { document.getElementById('importModal').classList.remove('active'); }

  async function doImport(action) {
    var txt = document.getElementById('importJson').value.trim();
    if (!txt) { toast('请粘贴 JSON'); return; }
    var data;
    try { data = JSON.parse(txt); } catch (e) { toast('JSON 格式错误: ' + e.message); return; }
    if (!Array.isArray(data)) { toast('需要 JSON 数组'); return; }
    var body = action === 'replace' ? { action: 'replace', keywords: data } : { add: data };
    var params = action === 'replace' ? 'action=keywords' : 'action=keywords';
    var r = await api('/api/tools?' + params, { method: 'POST', body: JSON.stringify(body) });
    if (r.success) {
      toast((action === 'replace' ? '已全量替换' : '已追加') + '，当前共 ' + r.total + ' 个' + (r.errors && r.errors.length ? '，' + r.errors.length + ' 个失败' : ''));
      closeImportModal(); loadKeywords();
    } else { toast('导入失败: ' + (r.error || '')); }
  }

  function exportKeywords() {
    var blob = new Blob([JSON.stringify(KEYWORDS, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'keywords-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
  }
</script>
</body>
</html>
