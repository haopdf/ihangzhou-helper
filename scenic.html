<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="杭州景区指南：西湖十景、灵隐寺、孤山、河坊街、龙井问茶、三潭印月">
  <meta name="keywords" content="杭州景点,西湖十景,灵隐寺,孤山,三潭印月">
  <meta name="theme-color" content="#1565c0">
  <title>景区指南 · iHangzhou 杭州生活助手</title>
  <link rel="stylesheet" href="css/style.css?v=20261018k">
  <script src="js/layout.js?v=20261018k"></script>
  <script src="js/breadcrumb.js?v=20261018k"></script>
  <style>
    .p-name{font-size:28px;font-weight:700;color:#0d47a1;margin:2px 0 4px}
    .p-name-sub{font-size:15px;color:#1565c0;margin-bottom:12px}
    .p-badge{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;display:inline-block;margin-bottom:8px;background:#e3f2fd;color:#0d47a1}
    .p-section{background:#fff;border-radius:14px;padding:16px;margin:12px 16px;box-shadow:0 2px 8px rgba(21,101,192,.06)}
    .p-section h3{font-size:15px;font-weight:600;color:#0d47a1;margin:0 0 8px;display:flex;align-items:center;gap:6px}
    .p-feat-item{display:inline-block;padding:3px 8px;background:#e3f2fd;border-radius:8px;font-size:11px;color:#1565c0;margin:3px 4px 0 0}
    .p-card{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5}
    .p-card:last-child{border-bottom:none}
    .p-card-ico{width:36px;height:36px;background:#e3f2fd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .p-card-name{font-size:14px;font-weight:600;color:#0d47a1}
    .p-card-desc{font-size:12px;color:#888;margin-top:2px}
    .p-tip{background:#fff8e1;border-left:4px solid #ffa726;padding:10px 14px;font-size:13px;color:#f57f17;margin:0 16px 8px;border-radius:0 8px 8px 0}
    .p-back{display:block;text-align:center;padding:12px;background:#1565c0;color:#fff;border-radius:24px;font-size:14px;text-decoration:none;max-width:180px;margin:16px auto}
  </style>
<link rel="stylesheet" href="css/channel.css?v=20261018k">
<style>
  /* 详情内容容器：移动 16px gutter；桌面贴齐 1180（与首页同标准） */
  #scenicContent{padding:16px}
  @media (min-width:1024px){
    #scenicContent{padding:16px 0}
    .p-section{margin-left:0;margin-right:0}
  }
</style>
</head>
<body>
  <script>
    window.IHZ_PAGE = { title: "景区指南", icon: "🏛️", channelId: "scenic" };
    window.IZ_SKIP_APP_INIT = true;
    window.IZ_SKIP_APP_THEME = true;
  </script>

  <div class="page active" id="pageChannel">
    <div id="scenicContent"></div>
    <div style="text-align:center;padding:24px 16px 48px">
      <a href="index.html" class="p-back">← 返回首页</a>
    </div>
  </div>

  <script src="js/scenic-data.js"></script>
  <script>
    /* 列表视图：无 id 时渲染（面包屑栏目级默认链回本页 = 列表） */
    function renderScenicList(){
      var c=document.getElementById('scenicContent');
      if(!c)return;
      var keys=window.SCENIC_DATA?Object.keys(window.SCENIC_DATA):[];
      var ht=document.getElementById('headerTitle');
      document.title='景区指南 · iHangzhou';
      if(ht)ht.textContent='🏛️ 景区指南';
      c.style.padding='0';
      var cards=keys.map(function(k){var v=window.SCENIC_DATA[k];
        return '<a class="p-card" href="scenic.html?id='+k+'"><span class="p-card-ico">🏛️</span><div><div class="p-card-name">'+v.name+'</div><div class="p-card-desc">'+(v.subtitle||'')+'</div></div></a>';
      }).join('');
      c.innerHTML='<div class="p-hero"><div class="p-hero-inner"><div class="p-hero-title">景区指南</div><div class="p-hero-sub">西湖十景 · 灵隐寺 · 孤山 · 河坊街 · 龙井问茶…'+keys.length+' 处一站看全</div></div></div><div class="p-card-grid">'+cards+'</div>';
      if(window.IHZW&&IHZW.prependCrumb)IHZW.prependCrumb(document.body,'景区指南','全部景区');
    }
    function renderScenic(id){
      var c = document.getElementById('scenicContent');
      if (!c) return;
      var data = window.SCENIC_DATA ? window.SCENIC_DATA[id] : null;
      var keys = window.SCENIC_DATA ? Object.keys(window.SCENIC_DATA) : [];
      if (!data) {
        c.innerHTML = '<div class="p-section" style="text-align:center;color:#999">没有找到相关景区信息<br><br><a href="scenic.html" style="color:#1565c0">← 返回景区列表</a></div>';
        if(window.IHZW&&IHZW.prependCrumb)IHZW.prependCrumb(document.body,'景区指南','未找到');
        return;
      }
      var h = '';
      h += '<span class="p-badge">' + (data.category || '🏛️ 景区') + '</span>';
      h += '<div class="p-name">' + data.name + '</div>';
      h += '<div class="p-name-sub">' + (data.subtitle || '') + '</div>';
      if (data.history) {
        h += '<div class="p-section"><h3>📖 景区介绍</h3><div style="font-size:14px;color:#444;line-height:1.7">' + data.history + '</div>';
        if (data.features && data.features.length) {
          h += '<div style="margin-top:8px">';
          data.features.forEach(function(f){ h += '<span class="p-feat-item">' + f + '</span>'; });
          h += '</div>';
        }
        h += '</div>';
      }
      if (data.area) {
        h += '<div class="p-section"><h3>📍 地理位置</h3><div style="font-size:14px;color:#444">' + data.area + '</div></div>';
      }
      if (data.tips) {
        h += '<div class="p-tip">💡 小贴士：' + data.tips + '</div>';
      }
      if (data.shops && data.shops.length) {
        h += '<div class="p-section"><h3>🎯 游玩推荐</h3>';
        data.shops.forEach(function(s) {
          h += '<div class="p-card"><div class="p-card-ico">📍</div><div>';
          h += '<div class="p-card-name">' + s.n + '</div>';
          if (s.a) h += '<div class="p-card-desc">📍 ' + s.a + '</div>';
          if (s.d) h += '<div class="p-card-desc" style="color:#888;font-size:12px;margin-top:2px">' + s.d + '</div>';
          h += '</div></div>';
        });
        h += '</div>';
      }
      var nb = keys.filter(function(k){ return k !== id; }).slice(0, 4);
      if (nb.length) {
        h += '<div class="p-section"><h3>🏛️ 更多景区</h3><div style="display:flex;flex-wrap:wrap;gap:8px">';
        nb.forEach(function(k) {
          var v = window.SCENIC_DATA[k];
          h += '<a href="scenic.html?id=' + k + '" style="flex:1;min-width:45%;text-align:center;padding:14px 8px;background:#fff;border:1px solid #1565c020;border-radius:10px;text-decoration:none;font-size:13px;color:#0d47a1;font-weight:600">' + v.name + '</a>';
        });
        h += '</div></div>';
      }
      h += '<a href="cat.html?c=travel" style="display:block;text-align:center;padding:14px;background:#1565c0;color:#fff;border-radius:24px;text-decoration:none;font-size:14px;font-weight:600;margin:12px 16px">← 旅游频道</a>';
      c.innerHTML = h;
      if(window.IHZW&&IHZW.prependCrumb)IHZW.prependCrumb(document.body,'景区指南',data.name);
    }
    (function(){
      var id = (location.search.split('id=')[1] || '').split('&')[0];
      if(!id){renderScenicList()}else{renderScenic(decodeURIComponent(id))}
    })();
  </script>
  <script>if(window.IZ&&IZ.layout){document.addEventListener('DOMContentLoaded',IZ.layout.init)}</script>
</body>
</html>
