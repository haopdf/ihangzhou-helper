<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="iHangzhou · 百年老店 - 奎元馆、楼外楼、知味观、胡庆余堂——杭州老字号一站看全。">
  <meta name="keywords" content="杭州老字号,奎元馆,楼外楼,知味观,胡庆余堂">
  <meta name="theme-color" content="#b71c1c">
  <meta property="og:title" content="百年老店 · iHangzhou">
  <meta property="og:description" content="奎元馆·楼外楼·知味观·胡庆余堂——杭州老字号一站看全">

  <script src="js/layout.js?v=20261018l"></script>
  <script src="js/breadcrumb.js?v=20261018l"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
  <style>
    :root{--primary:#b71c1c;--primary-dark:#7f1d1d}
    .sub-page{max-width:720px;margin:0 auto;padding:0 0 40px}
    .sub-hero{background:linear-gradient(135deg,#b71c1cdd,#7f1d1d99);padding:24px 16px 20px;color:#fff;text-align:center}
    .sub-hero h1{font-size:22px;font-weight:700;margin:6px 0 8px;display:flex;align-items:center;justify-content:center;gap:8px}
    .sub-hero h1 .hero-icon{font-size:32px}
    .sub-hero p{font-size:14px;opacity:0.9;line-height:1.6;max-width:480px;margin:0 auto}
    .sub-body{padding:16px;max-width:720px;margin:0 auto}
    .sub-block{margin-bottom:20px}
    .sub-sec-ttl{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:6px;color:var(--text)}
    .sub-third{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(min-width:600px){.sub-third{grid-template-columns:repeat(4,1fr)}}
    .sub-third-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;text-align:center;transition:transform .15s}
    .sub-third-card:active{transform:scale(0.96)}
    .sti{font-size:28px}
    .stn{font-size:13px;color:var(--text);line-height:1.3;font-weight:600}
    .std{font-size:11px;color:var(--text-muted);line-height:1.3}
    .sub-feat{display:flex;flex-direction:column;gap:8px}
    .sub-feat-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:background .15s}
    .sub-feat-card:active{background:var(--bg-hover)}
    .sf-ic{font-size:28px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg-alt);border-radius:10px}
    .sf-bd{flex:1;min-width:0}
    .sf-t{font-size:14px;font-weight:600;color:var(--text)}
    .sf-d{font-size:12px;color:var(--text-muted);display:block;margin-top:2px}
    .sf-ar{font-size:18px;color:var(--text-muted);flex-shrink:0}
    .sub-crumb{padding:12px 16px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--bg-alt)}
    .sub-crumb a{color:var(--primary);text-decoration:none;font-weight:500}
    .sub-crumb b{color:var(--text);font-weight:600}
    .sub-crumb .sep{color:var(--text-muted)}
    .sub-back{display:inline-block;padding:10px 20px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;margin-top:12px}
    .p-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;color:var(--text)}
    .p-card-ico{font-size:32px;flex-shrink:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--bg-alt);border-radius:12px}
    .p-card-name{font-size:15px;font-weight:600}
    .p-card-desc{font-size:12px;color:var(--text-muted);margin-top:2px}
    .p-card-grid{display:grid;grid-template-columns:1fr;gap:10px}
  </style>
</head>
<body>
  <script>
    window.IHZ_PAGE = { title: '百年老店', icon: '🏮' };
    window.IZ_SKIP_APP_INIT = true;
  </script>

  <div class="page active" id="pageSub">
    <!-- 面包屑 -->
    <div class="sub-crumb">
      <a href="index.html">首页</a>
      <span class="sep">/</span>
      <b>百年老店</b>
    </div>

    <!-- Hero -->
    <div class="sub-hero">
      <h1><span class="hero-icon">🏮</span> 百年老店</h1>
      <p>奎元馆 · 楼外楼 · 知味观 · 胡庆余堂 · 王润兴 · 张小泉 · 更多名店一站看全</p>
    </div>

    <!-- 主体内容 -->
    <div class="sub-body">
      <!-- 子栏目 -->
      <div class="sub-block">
        <div class="sub-sec-ttl">📂 子栏目 <span class="sub-more">8 个</span></div>
        <div class="sub-third">
          <a class="sub-third-card" href="laozihao.html"><span class="sti">🏮</span><span class="stn">全部老字号</span><span class="std">一站式浏览</span></a>
          <a class="sub-third-card" href="laozihao.html?id=louwailou"><span class="sti">🐟</span><span class="stn">楼外楼</span><span class="std">西湖醋鱼·龙井虾仁</span></a>
          <a class="sub-third-card" href="laozihao.html?id=kuiyuanguan"><span class="sti">🍜</span><span class="stn">奎元馆</span><span class="std">虾爆鳝面·百年面</span></a>
          <a class="sub-third-card" href="laozihao.html?id=zhi-wei-guan"><span class="sti">🥟</span><span class="stn">知味观</span><span class="std">百年点心·小笼</span></a>
          <a class="sub-third-card" href="laozihao.html?id=hu-qing-yu-tang"><span class="sti">💊</span><span class="stn">胡庆余堂</span><span class="std">国药老字号</span></a>
          <a class="sub-third-card" href="laozihao.html?id=wang-runxing"><span class="sti">🐠</span><span class="stn">王润兴</span><span class="std">乾隆私访·鱼头豆腐</span></a>
          <a class="sub-third-card" href="laozihao.html?id=zhang-da-sheng"><span class="sti">🔪</span><span class="stn">张小泉</span><span class="std">百年剪刀老字号</span></a>
          <a class="sub-third-card" href="laozihao.html?id=zhu-fu-tong"><span class="sti">🔩</span><span class="stn">朱府铜艺</span><span class="std">铜艺百年传承</span></a>
        </div>
      </div>

      <!-- 精选内容 -->
      <div class="sub-block">
        <div class="sub-sec-ttl">⭐ 招牌推荐</div>
        <div class="sub-feat">
          <a class="sub-feat-card" href="laozihao.html?id=louwailou">
            <span class="sf-ic">🐟</span>
            <span class="sf-bd"><span class="sf-t">西湖醋鱼</span><span class="sf-d">楼外楼招牌·酸甜鲜嫩</span></span>
            <span class="sf-ar">›</span>
          </a>
          <a class="sub-feat-card" href="laozihao.html?id=kuiyuanguan">
            <span class="sf-ic">🍜</span>
            <span class="sf-bd"><span class="sf-t">虾爆鳝面</span><span class="sf-d">奎元馆镇店之宝·百年传承</span></span>
            <span class="sf-ar">›</span>
          </a>
          <a class="sub-feat-card" href="laozihao.html?id=hu-qing-yu-tang">
            <span class="sf-ic">💊</span>
            <span class="sf-bd"><span class="sf-t">胡庆余堂</span><span class="sf-d">江南药王·国药老字号</span></span>
            <span class="sf-ar">›</span>
          </a>
        </div>
      </div>

    <!-- 老字号全列表（详情渲染区） -->
    <div id="detailContent"></div>

    </div>

    <!-- 返回首页 -->
    <div style="padding:0 16px;text-align:center">
      <a href="index.html" class="sub-back">← 返回首页</a>
    </div>
  </div>

  <script src="js/laozihao-data.js"></script>
  <script>
    (function () {
      function renderLaozhaoList(){
        var c=document.getElementById('detailContent');
        if(!c) return;
        var keys=window.LAOZHAO_DATA?Object.keys(window.LAOZHAO_DATA):[];
        var block=document.createElement('div');
        block.className='sub-block';
        block.innerHTML='<div class="sub-sec-ttl">🏮 全部老字号 <span class="sub-more">'+keys.length+' 家</span></div>';
        var grid=document.createElement('div');
        grid.className='p-card-grid';
        grid.style.padding='0 0 20px';
        keys.forEach(function(k){
          var v=window.LAOZHAO_DATA[k];
          grid.innerHTML+='<a class="p-card" href="laozihao.html?id='+k+'"><span class="p-card-ico">🏮</span><div><div class="p-card-name">'+v.name+'</div><div class="p-card-desc">'+(v.subtitle||'')+'</div></div></a>';
        });
        block.appendChild(grid);
        // 只在没有 ?id= 时显示
        var id=(location.search.split('id=')[1]||'').split('&')[0];
        if(!id) c.appendChild(block);
      }
      function renderLaozhao(id){
        var c=document.getElementById('detailContent');
        if(!c) return;
        var data=window.LAOZHAO_DATA?window.LAOZHAO_DATA[id]:null;
        var keys=Object.keys(window.LAOZHAO_DATA||{});
        if(!data){
          c.innerHTML='<div style="text-align:center;padding:40px 20px;color:#999">没有找到相关信息<br><br><a href="laozihao.html" style="color:#b71c1c">← 返回列表</a></div>';
          return;
        }
        var h='<div class="sub-section" style="padding:16px;background:#fff;border-radius:14px;margin-bottom:16px">';
        if(data.badge) h+='<span style="display:inline-block;padding:4px 10px;background:#ffebee;border-radius:8px;font-size:11px;color:#b71c1c;font-weight:600;margin-bottom:8px">'+data.badge+'</span>';
        h+='<div style="font-size:20px;font-weight:700;margin:6px 0">'+data.name+'</div>';
        h+='<div style="font-size:13px;color:#888;margin-bottom:12px">'+(data.subtitle||'')+'</div>';
        if(data.period) h+='<div style="background:#fff8e1;border-radius:10px;padding:10px 14px;font-size:13px;color:#f57f17;margin-bottom:12px">📅 '+data.period+'</div>';
        if(data.history) h+='<div style="font-size:14px;color:#444;line-height:1.8;margin-bottom:12px">'+data.history+'</div>';
        if(data.features&&data.features.length){
          h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">';
          data.features.forEach(function(f){h+='<span style="display:inline-block;padding:3px 8px;background:#ffebee;border-radius:8px;font-size:11px;color:#b71c1c">'+f+'</span>'});
          h+='</div>';
        }
        if(data.shops&&data.shops.length){
          h+='<div style="font-weight:600;margin-bottom:6px">📍 门店信息</div>';
          data.shops.forEach(function(s){
            h+='<div style="padding:8px 0;border-top:1px solid #f5f5f5"><div style="font-size:14px;font-weight:600">'+s.n+'</div>';
            if(s.a) h+='<div style="font-size:12px;color:#888;margin-top:2px">'+s.a+'</div>';
            h+='</div>';
          });
        }
        if(data.spots&&data.spots.length){
          h+='<div style="font-weight:600;margin:12px 0 6px">📍 看点</div>';
          data.spots.forEach(function(s){
            h+='<div style="padding:6px 0;border-top:1px solid #f5f5f5"><div style="font-size:14px;font-weight:600">'+s.n+'</div>';
            if(s.d) h+='<div style="font-size:12px;color:#888;margin-top:2px">'+s.d+'</div>';
            h+='</div>';
          });
        }
        h+='<a href="laozihao.html" style="display:block;text-align:center;padding:12px;background:#b71c1c;color:#fff;border-radius:12px;text-decoration:none;font-size:14px;font-weight:600;margin-top:16px">← 返回老字号列表</a>';
        h+='</div>';
        c.innerHTML=h;
      }
      var id=(location.search.split('id=')[1]||'').split('&')[0];
      if(id){renderLaozhao(decodeURIComponent(id))}else{renderLaozhaoList()}
    })();
  </script>
  <script>IZ.layout.init();</script>
</body>
</html>
