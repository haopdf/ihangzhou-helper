<!-- 统一顶栏 -->
<header class="app-header" id="appHeader">
  <a href="index.html" class="header-brand">
    <span class="header-back">‹</span>
    <span class="header-title" id="headerTitle">iHangzhou</span>
  </a>
  <div class="header-search">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="headerSearchInput" placeholder="搜索本片区..." autocomplete="off">
  </div>
  <button class="header-action" id="shareBtn" title="分享" aria-label="分享">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
  </button>
</header>

<!-- 设置面板 -->
<div class="settings-overlay" id="settingsOverlay"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-head">
    <span class="settings-label-lg">⚙️ 显示设置</span>
    <button class="settings-close" id="settingsCloseBtn" aria-label="关闭">✕</button>
  </div>
  <div class="settings-group">
    <div class="settings-row">
      <span class="settings-label">🌙 深色模式</span>
      <label class="switch"><input type="checkbox" id="darkModeToggle"><span class="switch-track"></span></label>
    </div>
    <div class="settings-row">
      <span class="settings-label">🔤 大字模式</span>
      <label class="switch"><input type="checkbox" id="largeFontToggle"><span class="switch-track"></span></label>
    </div>
  </div>
  <div class="settings-group">
    <div class="settings-row">
      <span class="settings-label">🌈 主题色</span>
      <div class="theme-colors" id="themeColors">
        <button class="theme-dot active" data-color="pine" style="--c:#1b4d3e" aria-label="松绿"></button>
        <button class="theme-dot" data-color="bamboo" style="--c:#4a7c59" aria-label="竹青"></button>
        <button class="theme-dot" data-color="gold" style="--c:#a8842c" aria-label="鎏金"></button>
        <button class="theme-dot" data-color="plum" style="--c:#a0433b" aria-label="胭脂"></button>
        <button class="theme-dot" data-color="ink" style="--c:#2c4a5e" aria-label="黛蓝"></button>
      </div>
    </div>
  </div>
</div>
