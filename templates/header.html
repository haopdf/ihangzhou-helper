<!-- 统一顶栏 -->
<header class="app-header" id="appHeader">
  <a href="/index.html" class="header-brand">
    <span class="header-back">‹</span>
    <span class="header-title" id="headerTitle">iHangzhou</span>
  </a>
  <div class="header-search">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="headerSearchInput" placeholder="搜索本片区..." autocomplete="off">
  </div>
  <button class="header-action" id="settingsBtn" title="显示设置" aria-label="显示设置" onclick="toggleSettings()">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h9M19 8h2M3 16h3M13 16h8"/><circle cx="15" cy="8" r="2.6"/><circle cx="9.5" cy="16" r="2.6"/></svg>
  </button>
  <button class="header-action" id="shareBtn" title="分享" aria-label="分享">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
  </button>
</header>

<!-- 设置面板（与首页 index.html 完全一致：字号 / 区县 / 暗色） -->
<div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-title"><span>⚙️ 设置</span><button class="settings-close" onclick="toggleSettings()" aria-label="关闭">✕</button></div>
  <div class="settings-item">
    <span class="settings-label">📍 当前城市</span>
    <div class="city-wrap" style="position:relative;">
      <div class="topbar-city" id="citySelect" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--primary);font-weight:600;">
        <span id="cityName">杭州</span><span class="city-arrow">▼</span>
      </div>
      <div class="city-dropdown" id="cityDropdown">
        <div class="city-dropdown-title">选择区县</div>
      </div>
    </div>
  </div>
  <div class="settings-item">
    <span class="settings-label">🌙 暗色模式</span>
    <label class="settings-switch"><input type="checkbox" id="darkToggle" onchange="setDarkMode(this.checked)"><span class="switch-slider"></span></label>
  </div>
  <div class="settings-item">
    <span class="settings-label">🔤 大字模式</span>
    <label class="settings-switch"><input type="checkbox" id="elderlyToggle" onchange="setElderlyMode(this.checked)"><span class="switch-slider"></span></label>
  </div>
</div>
