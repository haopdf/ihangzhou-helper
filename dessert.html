<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>杭州甜品 · iHangzhou</title>
  <meta name="theme-color" content="#1f7a5a">
  <meta name="description" content="杭州传统甜品糕点：定胜糕、条头糕、桂花糖藕、龙井酥、藕粉、青团、桂花糕">
  <link rel="stylesheet" href="css/style.css?v=20261018a">
  <script src="js/layout.js?v=20261016e"></script>
  <script src="js/dessert-data.js"></script>
  <style>
:root{--primary:#ec4899;--primary-dark:#be185d;}
    .p-hero{position:relative;width:100%;height:200px;overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
    .p-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.55))}
    .p-hero .p-hero-inner{position:absolute;bottom:0;left:0;right:0;padding:16px;z-index:2;color:#fff}
    .p-hero .p-hero-title{font-size:24px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.5)}
    .p-hero .p-hero-sub{font-size:13px;opacity:.92;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
    .p-body{padding:16px}
    .p-badge{display:inline-block;font-size:12px;padding:4px 10px;background:#fce7f3;color:var(--primary-dark);border-radius:10px;font-weight:600;margin-bottom:8px}
    .p-badge{float:right;font-size:12px;color:var(--text-muted);margin-bottom:8px}
    .p-hist{margin:12px 0;padding:12px;background:#fdf2f8;border-radius:10px;border-left:3px solid var(--primary)}
    .p-hist p{font-size:13px;color:var(--text-secondary);line-height:1.7;margin:0}
    .p-section{margin:20px 0 8px}
    .p-section h3{font-size:16px;font-weight:700;margin:0 0 10px;padding-left:8px;border-left:3px solid var(--primary)}
    .p-feat{display:flex;flex-direction:column;gap:6px}
    .p-feat i{font-size:13px;color:var(--text);padding:8px 12px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
    .p-feat i::before{content:'\2713';color:var(--primary);font-weight:700;font-size:12px;flex-shrink:0;margin-top:1px}
    .p-cards{display:flex;flex-direction:column;gap:8px}
    .p-inforow{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg-card);border-radius:10px;border:1px solid var(--border-light)}
    .p-inforow .p-ik{font-size:22px;flex-shrink:0}
    .p-inforow .p-iv{font-size:14px;font-weight:600;color:var(--text)}
    .p-inforow .p-card-desc{font-size:12px;color:var(--text-secondary);margin-top:2px}
    .p-neighbors{margin-top:24px;border-top:8px solid var(--bg);padding-top:16px}
    .p-neighbors h3{font-size:15px;font-weight:700;margin:0 0 12px}
    .p-neighbor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .p-neighbor{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg);border-radius:8px;text-decoration:none;color:var(--text);font-size:13px;font-weight:500}
    .p-neighbor:active{opacity:.7}
    .p-empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
    .p-empty .p-hero-icon{font-size:64px;margin-bottom:16px}
    @media(min-width:768px){.p-hero{height:300px}.p-body{max-width:720px;margin:0 auto}}
  </style>
<link rel="stylesheet" href="css/channel.css?v=20261018a">
</head>
<body>
  <script>window.IHZ_PAGE={title:'甜品糕点',icon:'�'};window.IZ_SKIP_APP_INIT=true;window.IZ_SKIP_APP_THEME=true;</script>
  <div id="dessertContainer"><div class="p-empty"><div class="p-hero-icon">🍰</div><h2>加载中...</h2></div></div>
  <script>
    function renderDessert(id){
      var data=window.DESSERT_DATA?window.DESSERT_DATA[id]:null;
      var c=document.getElementById('dessertContainer');
      var ht=document.getElementById('headerTitle');
      if(!data){c.innerHTML='<div class="p-empty"><div class="p-hero-icon">�</div><h2>未找到该甜品</h2><p style="margin:8px 0 16px">ID:'+(id||'(空)')+'</p><a href="cat.html?c=food&s=%E7%94%9C%E5%93%81" class="btn" style="display:inline-block;padding:10px 20px;background:#ec4899;color:#fff;border-radius:8px;text-decoration:none;font-size:14px">← 返回</a> <a href="food.html" class="btn" style="display:inline-block;padding:10px 20px;background:var(--primary);color:#fff;border-radius:8px;text-decoration:none;font-size:14px;margin-left:8px">美食首页</a></div>';if(ht)ht.textContent='🍰 甜品';return;}
      document.title=data.name+' · 甜品 · iHangzhou';
      if(ht)ht.textContent='� '+data.name;
      var h='<div class="p-hero"><div class="p-hero-inner"><div class="p-hero-title">'+data.name+'</div><div class="p-hero-sub">'+data.subtitle+'</div></div></div><div class="p-body">';
      h+='<div class="p-badge">'+data.badge+' '+data.name+'</div>';
      if(data.period)h+='<span class="p-badge">'+data.period+'</span>';
      h+='<div style="clear:both"></div>';
      if(data.history)h+='<div class="p-hist"><p>📜 '+data.history+'</p></div>';
      if(data.features&&data.features.length){h+='<div class="p-section"><h3>✨ 特色</h3><div class="p-feat">';data.features.forEach(function(f){h+='<i>'+f+'</i>'});h+='</div></div>';}
      if(data.shops&&data.shops.length){h+='<div class="p-section"><h3>🏪 去哪买</h3><div class="p-cards">';data.shops.forEach(function(s){h+='<div class="p-inforow"><span class="p-ik">�️</span><div><div class="p-iv">'+s.n+'</div><div class="p-card-desc">'+s.a+'</div></div></div>'});h+='</div></div>';}
      var keys=window.DESSERT_DATA?Object.keys(window.DESSERT_DATA):[];
      var nb=keys.filter(function(k){return k!==id}).slice(0,4);
      if(nb.length){h+='<div class="p-neighbors"><h3>🍰 更多甜品</h3><div class="p-neighbor-grid">';nb.forEach(function(k){var v=window.DESSERT_DATA[k];h+='<a class="p-neighbor" href="dessert.html?id='+k+'"><span>'+v.badge+'</span><span>'+v.name+'</span></a>'});h+='</div></div>';}
      h+='<div style="margin-top:24px;display:flex;gap:10px"><a href="cat.html?c=food&s=%E7%94%9C%E5%93%81" style="flex:1;text-align:center;padding:12px;background:#ec4899;color:#fff;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600">← 甜品频道</a><a href="food.html" style="flex:1;text-align:center;padding:12px;background:var(--primary);color:#fff;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600">美食首页</a></div>';
      h+='</div>';c.innerHTML=h;
    }
    (function(){var id=(location.search.split('id=')[1]||'').split('&')[0];renderDessert(decodeURIComponent(id))})();
  </script>
  <script>if(window.IZ&&IZ.layout){document.addEventListener('DOMContentLoaded',IZ.layout.init)}</script>
</body>
</html>
