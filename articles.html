<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>杭州故事 · 文章合集 · iHangzhou</title>
  <meta name="description" content="杭州本地故事合集：美食文化、历史人物、街道风情、民俗传承，2700+ 篇深度文章，看懂一座城">
  <meta name="keywords" content="杭州故事,杭州文章,杭州文化,杭州历史,杭州美食,iHangzhou">
  <meta name="theme-color" content="#0ea5e9">
  <link rel="canonical" href="https://www.ihangzhou.net/articles.html">
  <link rel="stylesheet" href="css/style.css?v=20260921h">
  <script src="js/layout.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
  <style>
    .art-hero {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: #fff;
      padding: 26px 16px 20px 16px;
      text-align: center;
    }
    .art-hero h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
    .art-hero p { font-size: 13px; opacity: 0.92; }
    .art-stats { display: flex; justify-content: center; gap: 10px; margin-top: 12px; font-size: 11px; opacity: 0.9; flex-wrap: wrap; }
    .art-stats span { background: rgba(255,255,255,0.18); padding: 4px 16px; border-radius: 12px; font-weight: 500; }

    /* ========== 搜索区域 ========== */
    .art-search { padding: 14px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
    .art-search-wrap { position: relative; max-width: 720px; margin: 0 auto; }
    .art-search input { width: 100%; padding: 12px 16px 12px 40px; border: 1px solid var(--border); border-radius: 22px; background: var(--bg-alt); font-size: 14px; outline: none; }
    .art-search input:focus { border-color: var(--primary); background: var(--bg-card); }
    .art-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: 0.5; pointer-events: none; }
    .art-search-hint { font-size: 11px; color: var(--text-muted); margin-top: 8px; padding: 0 4px; }
    .art-search-hint b { color: var(--primary); font-weight: 500; }

    /* ========== 分类筛选栏（替代旧水平滚动） ========== */
    .art-filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 56px;
      z-index: 50;
    }
    .art-current-cat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      transition: all .2s;
    }
    .art-current-cat:active { background: var(--border-light); }
    .art-current-cat .arrow { font-size: 11px; transition: transform .25s; }
    .art-current-cat.open .arrow { transform: rotate(180deg); }
    .art-current-cat .count {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .art-cat-grid-toggle {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-secondary);
      transition: all .2s;
    }
    .art-cat-grid-toggle:active { background: var(--primary); color: #fff; }

    /* ========== 底部弹出分类面板 ========== */
    .art-cat-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9998;
      display: none;
      opacity: 0;
      transition: opacity .25s;
    }
    .art-cat-sheet-overlay.show {
      display: block;
      opacity: 1;
    }
    .art-cat-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-card);
      border-radius: 20px 20px 0 0;
      z-index: 9999;
      max-height: 75vh;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
    }
    .art-cat-sheet.show { transform: translateY(0); }

    .art-cat-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .art-cat-sheet-header h3 { font-size: 16px; font-weight: 600; }
    .art-cat-sheet-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--bg-alt);
      cursor: pointer;
      font-size: 16px;
      color: var(--text-muted);
      font-family: inherit;
      border: none;
    }
    .art-cat-sheet-body {
      overflow-y: auto;
      flex: 1;
      padding: 16px 20px 32px;
      -webkit-overflow-scrolling: touch;
    }
    .art-cat-group-title {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      margin: 16px 0 8px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .art-cat-group-title:first-child { margin-top: 0; }
    .art-cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (min-width: 768px) {
      .art-cat-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .art-cat-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px;
      background: var(--bg-alt);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      text-align: center;
    }
    .art-cat-card:active { transform: scale(0.95); }
    .art-cat-card.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .art-cat-card.active .card-count { opacity: 0.85; color: #fff; }
    .art-cat-card .card-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .art-cat-card .card-count {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* ========== 文章列表 ========== */
    .art-list { padding: 8px 16px 120px 16px; max-width: 1100px; margin: 0 auto; }
    @media (min-width: 1024px) { .art-list { max-width: 1280px; } }
    @media (min-width: 1440px) { .art-list { max-width: 1440px; } }
    .art-item {
      display: block;
      padding: 14px;
      background: var(--bg-card);
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border-light);
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .art-item:active { transform: scale(0.98); box-shadow: var(--shadow); }
    .art-item-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.4; }
    .art-item-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .art-item-meta span { margin-right: 8px; }
    .art-item-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .art-empty { text-align: center; padding: 40px 16px; color: var(--text-muted); font-size: 14px; }
    .art-load { text-align: center; padding: 20px; color: var(--primary); font-size: 13px; cursor: pointer; }

    .art-deep-search-btn {
      display: inline-block;
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      margin: 8px 0;
      transition: all 0.2s;
      font-family: inherit;
    }
    .art-deep-search-btn:hover { background: var(--primary); color: #fff; }
    .art-deep-search-btn:disabled { opacity: 0.6; cursor: wait; }
    .art-result-count { font-size: 12px; color: var(--text-muted); margin-top: 8px; padding: 0 4px; }
    .art-result-count b { color: var(--primary); font-weight: 500; }
  </style>
</head>
<body>
  <script>
    window.IHZ_PAGE = { title: '杭州故事', icon: '📚' };
    window.IZ_SKIP_APP_THEME = true;
  </script>

  <div class="art-hero">
    <h1>📚 杭州故事 · 本地文章合集</h1>
    <p>本地深度创作，读懂这座城市的每一面</p>
    <div class="art-stats">
      <span id="artTotalCount">加载中...</span>
      <span id="artCatCount"></span>
    </div>
  </div>

  <div class="art-search">
    <div class="art-search-wrap">
      <span class="art-search-icon">🔍</span>
      <input type="text" id="artSearchInput" placeholder="搜索杭州周末去哪/下雨/拍照/亲子/美食..." autocomplete="off">
    </div>
    <div class="art-search-hint">试试关键词：<b>周末</b> · <b>下雨</b> · <b>拍照</b> · <b>亲子</b> · <b>古镇</b> · <b>夜景</b></div>
    <button id="deepSearchBtn" class="art-deep-search-btn" style="display:none;">🔍 深度搜索正文</button>
    <div id="artResultCount" class="art-result-count" style="display:none;"></div>
  </div>

  <!-- 替代旧水平滚动分类 tab 的筛选栏 -->
  <div class="art-filter-bar">
    <button class="art-current-cat" id="currentCatBtn" aria-label="选择分类">
      <span id="currentCatLabel">全部分类</span>
      <span class="arrow">▼</span>
    </button>
    <button class="art-cat-grid-toggle" id="quickGridToggle" title="快速分类浏览" aria-label="快速分类">⊞</button>
  </div>

  <!-- 底部弹出分类面板 -->
  <div class="art-cat-sheet-overlay" id="catSheetOverlay"></div>
  <div class="art-cat-sheet" id="catSheet" role="dialog" aria-label="选择分类">
    <div class="art-cat-sheet-header">
      <h3>📂 选择分类</h3>
      <button class="art-cat-sheet-close" id="catSheetClose" aria-label="关闭">✕</button>
    </div>
    <div class="art-cat-sheet-body" id="catSheetBody">
      <!-- 动态渲染 -->
    </div>
  </div>

  <div class="art-list" id="artList">
    <div class="art-empty">加载中...</div>
  </div>

  <script src="js/app.js?v=20260928c"></script>
<script src="js/analytics.js?v=20260928c"></script>
  <script>
    if (window.IZ && IZ.layout) {
      document.addEventListener("DOMContentLoaded", IZ.layout.init);
    }
  </script>
  <script>
    var ALL_ARTICLES = [];
    var CAT_STATS = {};      // { catName: count }
    var SORTED_CATS = [];    // 按文章数降序的分类名数组
    var ACTIVE_CAT = 'all';  // 当前选中分类
    var FILTERED = [];
    var PAGE_SIZE = 30;
    var CURRENT_PAGE = 0;
    var PAGE_PARAMS = new URLSearchParams(location.search);

    // 深度搜索（正文全文搜索）相关状态
    var deepSearchCache = {};
    var deepSearched = false;
    var deepSearchLoading = false;

    // 清理分类名（去掉开头的 "01-" "02-" 等编号）
    function cleanCat(c) { return c.replace(/^\d+[-_\s]+/, '').replace('系列','').trim(); }

    // ========== 分类面板逻辑 ==========
    var sheetOverlay = document.getElementById('catSheetOverlay');
    var sheet = document.getElementById('catSheet');
    var currentCatBtn = document.getElementById('currentCatBtn');

    function openSheet() {
      sheetOverlay.classList.add('show');
      sheet.classList.add('show');
      document.body.style.overflow = 'hidden';
      currentCatBtn.classList.add('open');
    }
    function closeSheet() {
      sheetOverlay.classList.remove('show');
      sheet.classList.remove('show');
      document.body.style.overflow = '';
      currentCatBtn.classList.remove('open');
    }

    sheetOverlay.addEventListener('click', closeSheet);
    document.getElementById('catSheetClose').addEventListener('click', closeSheet);
    currentCatBtn.addEventListener('click', function(){
      if (sheet.classList.contains('show')) closeSheet(); else openSheet();
    });
    document.getElementById('quickGridToggle').addEventListener('click', openSheet);

    // ESC 关闭
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && sheet.classList.contains('show')) closeSheet();
    });

    // 渲染分类面板（卡片网格）
    function renderCatSheet() {
      var body = document.getElementById('catSheetBody');
      var html = '';

      // "全部"卡片
      html += '<div class="art-cat-group-title">快速选择</div>';
      html += '<div class="art-cat-grid">';
      html += '<div class="art-cat-card ' + (ACTIVE_CAT === 'all' ? 'active' : '') + '" data-cat="all">';
      html += '<span class="card-name">📚 全部</span>';
      html += '<span class="card-count">' + ALL_ARTICLES.length + ' 篇</span>';
      html += '</div>';
      html += '</div>';

      // 热门分类（文章最多的前 9 个）
      var topCats = SORTED_CATS.slice(0, 9);
      if (topCats.length) {
        html += '<div class="art-cat-group-title">热门分类</div>';
        html += '<div class="art-cat-grid">';
        topCats.forEach(function(c){
          html += '<div class="art-cat-card ' + (ACTIVE_CAT === c ? 'active' : '') + '" data-cat="' + esc(c) + '">';
          html += '<span class="card-name">' + esc(shorten(c)) + '</span>';
          html += '<span class="card-count">' + CAT_STATS[c] + ' 篇</span>';
          html += '</div>';
        });
        html += '</div>';
      }

      // 其余分类
      if (SORTED_CATS.length > 9) {
        html += '<div class="art-cat-group-title">全部分类（' + SORTED_CATS.length + '）</div>';
        html += '<div class="art-cat-grid">';
        SORTED_CATS.forEach(function(c){
          html += '<div class="art-cat-card ' + (ACTIVE_CAT === c ? 'active' : '') + '" data-cat="' + esc(c) + '">';
          html += '<span class="card-name">' + esc(shorten(c)) + '</span>';
          html += '<span class="card-count">' + CAT_STATS[c] + ' 篇</span>';
          html += '</div>';
        });
        html += '</div>';
      }

      body.innerHTML = html;

      // 绑定点击事件
      body.querySelectorAll('.art-cat-card').forEach(function(card){
        card.addEventListener('click', function(){
          selectCard(card.dataset.cat);
        });
      });
    }

    function selectCard(cat) {
      ACTIVE_CAT = cat;
      var label = document.getElementById('currentCatLabel');
      if (label) label.textContent = cat === 'all' ? '全部分类' : cat;
      closeSheet();
      render();
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function shorten(name) {
      // 超过 7 个字截断
      return name.length > 7 ? name.slice(0, 7) + '…' : name;
    }

    function updateCurrentCatLabel() {
      var label = document.getElementById('currentCatLabel');
      if (label) {
        if (ACTIVE_CAT === 'all') {
          label.textContent = '全部分类';
        } else {
          label.textContent = ACTIVE_CAT + ' (' + (CAT_STATS[ACTIVE_CAT] || 0) + ')';
        }
      }
    }

    // ========== 数据加载 ==========
    function loadArticles() {
      document.getElementById('artList').innerHTML = '<div class="art-empty">加载中...</div>';
      fetch('articles/index.json?t=' + Date.now())
        .then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data){
          ALL_ARTICLES = data.map(function(a){
            return Object.assign({}, a, { catClean: cleanCat(a.cat.split(' / ')[0]) });
          });

          // 统计分类
          CAT_STATS = {};
          ALL_ARTICLES.forEach(function(a){
            CAT_STATS[a.catClean] = (CAT_STATS[a.catClean] || 0) + 1;
          });
          SORTED_CATS = Object.keys(CAT_STATS).sort(function(a,b){ return CAT_STATS[b] - CAT_STATS[a]; });

          var totalEl = document.getElementById('artTotalCount');
          if (totalEl) totalEl.textContent = '📖 ' + ALL_ARTICLES.length + ' 篇文章';
          var catCountEl = document.getElementById('artCatCount');
          if (catCountEl) catCountEl.textContent = '📂 ' + SORTED_CATS.length + ' 个分类';

          // 初始化分类面板
          updateCurrentCatLabel();
          renderCatSheet();

          // URL 参数 ?cat= 自动选中分类
          var autoCat = PAGE_PARAMS.get('cat');
          if (autoCat && CAT_STATS[autoCat]) {
            ACTIVE_CAT = autoCat;
            updateCurrentCatLabel();
            renderCatSheet();
          }

          render();
        })
        .catch(function(err){
          console.error('文章加载失败:', err);
          document.getElementById('artList').innerHTML =
            '<div class="art-empty">' +
              '<div style="font-size:40px;margin-bottom:12px;">📭</div>' +
              '<div style="margin-bottom:8px;">文章加载失败</div>' +
              '<div style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">' + (err && err.message ? err.message : '网络异常') + '</div>' +
              '<button onclick="loadArticles()" style="padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer;font-weight:500;">🔄 重新加载</button>' +
            '</div>';
        });
    }

    // ========== 渲染逻辑 ==========
    function render() {
      var q = document.getElementById('artSearchInput').value.trim().toLowerCase();
      CURRENT_PAGE = 0;
      deepSearched = false;

      FILTERED = ALL_ARTICLES.filter(function(a){
        if (ACTIVE_CAT !== 'all' && a.catClean !== ACTIVE_CAT) return false;
        if (q && (a.title.toLowerCase().indexOf(q) < 0) && (a.summary.toLowerCase().indexOf(q) < 0) && (a.catClean.toLowerCase().indexOf(q) < 0)) return false;
        return true;
      });

      FILTERED.sort(function(a,b){ return b.words - a.words; });

      document.getElementById('artList').innerHTML = '';
      renderPage();

      // 深度搜索按钮显隐
      var deepBtn = document.getElementById('deepSearchBtn');
      if (deepBtn) {
        if (q && FILTERED.length < 3 && !deepSearched) {
          deepBtn.style.display = 'inline-block';
        } else {
          deepBtn.style.display = 'none';
        }
      }

      // 更新当前分类标签
      updateCurrentCatLabel();

      // 同步更新面板中 active 状态
      syncSheetActive();

      // 结果计数
      var countEl = document.getElementById('artResultCount');
      if (countEl) {
        if (q) {
          countEl.textContent = '标题/摘要搜索找到 ' + FILTERED.length + ' 篇' + (FILTERED.length < 3 && !deepSearched ? '，可尝试深度搜索正文' : '');
          countEl.style.display = 'block';
        } else {
          countEl.style.display = 'none';
        }
      }
    }

    function syncSheetActive() {
      var sheet = document.getElementById('catSheet');
      if (!sheet || !sheet.classList.contains('show')) return;
      sheet.querySelectorAll('.art-cat-card').forEach(function(card){
        if (card.dataset.cat === ACTIVE_CAT) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });
    }

    function renderPage() {
      var list = document.getElementById('artList');
      var start = CURRENT_PAGE * PAGE_SIZE;
      var end = start + PAGE_SIZE;
      var items = FILTERED.slice(start, end);

      if (items.length === 0 && start === 0) {
        list.innerHTML = '<div class="art-empty">没有找到相关文章</div>';
        return;
      }

      items.forEach(function(a){
        var el = document.createElement('a');
        el.className = 'art-item';
        el.href = 'articles/' + a.slug + '.html';
        el.innerHTML =
          '<div class="art-item-title">' + a.title + '</div>' +
          '<div class="art-item-meta"><span>📂 ' + a.catClean + '</span><span>📖 ' + Math.round(a.words/100)/10 + 'k 字</span></div>' +
          '<div class="art-item-summary">' + a.summary + '</div>';
        list.appendChild(el);
      });

      if (end < FILTERED.length) {
        var more = document.createElement('div');
        more.className = 'art-load';
        more.textContent = '加载更多 (' + (FILTERED.length - end) + ' 篇剩余)';
        more.onclick = function(){ CURRENT_PAGE++; renderPage(); };
        list.appendChild(more);
      }
    }

    // ========== 深度搜索（正文全文搜索） ==========
    function deepSearch(query) {
      if (!query || !ALL_ARTICLES.length || deepSearchLoading) return;
      deepSearchLoading = true;
      var btn = document.getElementById('deepSearchBtn');
      if (btn) { btn.textContent = '🔍 搜索中...'; btn.disabled = true; }

      var pending = ALL_ARTICLES.filter(function(a){ return !deepSearchCache.hasOwnProperty(a.slug); });
      var loaded = 0;

      function loadBatch(items) {
        if (!items.length) {
          deepSearched = true;
          deepSearchLoading = false;
          doDeepSearch(query);
          return;
        }
        var batch = items.slice(0, 5);
        Promise.all(batch.map(function(a){
          return fetch('articles/' + a.slug + '.html')
            .then(function(r){ return r.text(); })
            .then(function(html){
              var text = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
              deepSearchCache[a.slug] = text;
            })
            .catch(function(){ deepSearchCache[a.slug] = ''; });
        })).then(function(){
          loaded += batch.length;
          if (btn) btn.textContent = '🔍 搜索中... (' + loaded + '/' + pending.length + ')';
          loadBatch(items.slice(5));
        });
      }
      loadBatch(pending);
    }

    function doDeepSearch(query) {
      var q = query.toLowerCase();
      var results = ALL_ARTICLES.filter(function(a){
        var text = deepSearchCache[a.slug] || '';
        return text.toLowerCase().indexOf(q) >= 0 ||
               (a.title || '').toLowerCase().indexOf(q) >= 0 ||
               (a.summary || '').toLowerCase().indexOf(q) >= 0;
      });

      FILTERED = results.slice();
      FILTERED.sort(function(a,b){ return b.words - a.words; });
      CURRENT_PAGE = 0;

      var list = document.getElementById('artList');
      list.innerHTML = '';
      renderPage();

      var btn = document.getElementById('deepSearchBtn');
      if (btn) { btn.style.display = 'none'; btn.disabled = false; btn.textContent = '🔍 深度搜索正文'; }

      var countEl = document.getElementById('artResultCount');
      if (countEl) {
        countEl.textContent = '🔍 全文搜索找到 ' + results.length + ' 篇';
        countEl.style.display = 'block';
      }
    }

    // 搜索防抖
    var searchTimer = null;
    function doSearch() {
      clearTimeout(searchTimer);
      deepSearched = false;
      searchTimer = setTimeout(render, 300);
    }
    document.getElementById('artSearchInput').addEventListener('input', doSearch);

    // 顶栏搜索同步
    document.body.addEventListener('input', function (e) {
      if (e.target.id !== 'headerSearchInput') return;
      var artInput = document.getElementById('artSearchInput');
      if (artInput && artInput.value !== e.target.value) {
        artInput.value = e.target.value;
        doSearch();
      }
    });

    document.getElementById('deepSearchBtn')?.addEventListener('click', function(){
      var q = document.getElementById('artSearchInput').value.trim();
      if (q) deepSearch(q);
    });

    loadArticles();
    // URL 参数 ?q= 自动搜索（等数据加载完成后再触发）
    var autoQ = PAGE_PARAMS.get('q');
    if (autoQ) {
      document.getElementById('artSearchInput').value = autoQ;
      setTimeout(render, 200);
    }
  </script>
</body>
</html>
