      padding: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);

      color: var(--text);

      display: flex;
      align-items: center;

      color: var(--text-secondary);

      box-shadow: var(--shadow-md);

      -webkit-user-drag: none;

      color: var(--text);

    .dd-modal-card {
      background: var(--bg-card);

    .dd-modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .dd-modal-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .dd-modal-btn {
      display: block;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
    }
    .dd-modal-btn.amap {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);

    .dd-modal-btn.baidu {
      background: linear-gradient(135deg, #2962ff, #1e40af);

      border-radius: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>

    // 渲染列表
    function renderList(type, keyword) {
      var box = document.getElementById('districtList');
      var filtered = allDistricts.filter(function (d) {
        if (type && type !== 'all' && d.type !== type) return false;
        if (keyword) {
          var k = keyword.toLowerCase();
          if (d.name.toLowerCase().indexOf(k) < 0 && d.tag.toLowerCase().indexOf(k) < 0 && d.desc.toLowerCase().indexOf(k) < 0) return false;
        }
        return true;
      });
      if (!filtered.length) {
        box.innerHTML = '<div class="dd-loading">未找到匹配的区县</div>';
        return;
      }
      box.innerHTML = filtered.map(function (d) {
        var metaHtml = '<div class="dc-meta-item">📍 ' + d.area + '</div>' +
                       '<div class="dc-meta-item">👥 ' + d.population + '</div>' +
                       '<div class="dc-meta-item">📮 ' + d.postcode + '</div>';
        return '<a class="district-card" href="district.html?id=' + d.id + '">' +
          '<div class="dc-head">' +
            '<div class="dc-name-row">' +
              '<div class="dc-name">' + d.name + '</div>' +
              '<span class="dc-type-badge ' + d.type + '">' + d.type + '</span>' +
            '</div>' +
            '<div class="dc-arrow">›</div>' +
          '</div>' +
          '<div class="dc-tag">' + d.tag + '</div>' +
          '<div class="dc-desc">' + d.desc + '</div>' +
          '<div class="dc-meta">' + metaHtml + '</div>' +
        '</a>';
      }).join('');
    }

    // 渲染详情
    function renderDetail(d) {
      var view = document.getElementById('detailView');
      var landmarks = (d.landmarks || []).map(function (l) {
        return '<span class="dd-landmark">' + l + '</span>';
      }).join('');

      // 按 type 分组渲染景点（景区/古村/寺院/溶洞/工业旅游/博物馆/主题公园等）
      var groups = {};
      var groupOrder = [];
      (d.scenic || []).forEach(function (s, i) {
        var type = s.type || '其他';
        if (!groups[type]) { groups[type] = []; groupOrder.push(type); }
        s._idx = i;
        groups[type].push(s);
      });
      var scenicHtml = groupOrder.map(function (type) {
        var items = groups[type].map(function (s) {
          var imgName = (s.name || '').replace(/[\s（）()·、]/g, '-');
          var imgSrc = 'images/scenic/district/' + d.id + '-' + (s._idx+1) + '-' + imgName + '.jpg';
          return '<div class="dd-scenic-item" data-name="' + s.name + '" data-district="' + d.name + '">' +
            '<div class="dd-scenic-img" data-img="' + imgSrc + '">' +
              '<span class="dd-scenic-img-ph">🏞️</span>' +
            '</div>' +
            '<div class="dd-scenic-name">' + s.name + '</div>' +
            '<div class="dd-scenic-desc">' + s.desc + '</div>' +
            '<div class="dd-scenic-actions">查看详情 ›</div>' +
          '</div>';
        }).join('');
        return '<div class="dd-scenic-group">' +
          '<h3 class="dd-scenic-group-title">' + type + '</h3>' +
          '<div class="dd-scenic-list">' + items + '</div>' +
        '</div>';
      }).join('');

      // 高亮亮点
      var highlights = (d.highlights || []).map(function (h) {
        return '<span class="dd-highlight">' + h + '</span>';
      }).join('');

      // 外链入口（复用现有页面 + 政务/资讯外链）
      var nameEnc = encodeURIComponent(d.name);
      var shortName = d.name.replace(/区|市|县$/g, '');
      var shortEnc = encodeURIComponent(shortName);
      function extLink(url, icon, text, sub) {
        return '<a class="dd-ext-link" href="' + url + '" target="_blank" rel="noopener">' +
          '<span class="dd-ext-icon">' + icon + '</span>' +
          '<span class="dd-ext-text"><span class="dd-ext-title">' + text + '</span>' +
          (sub ? '<span class="dd-ext-sub">' + sub + '</span>' : '') + '</span>' +
          '<span class="dd-ext-arrow">›</span>' +
        '</a>';
      }
      // 复用站内页：人物故事（articles.html 搜索） / 美食（food.html?city= 过滤）
      var foodLink = '<a class="dd-ext-link" href="food.html?city=' + d.id + '">' +
        '<span class="dd-ext-icon">🍜</span>' +
        '<span class="dd-ext-text"><span class="dd-ext-title">' + d.name + '美食</span>' +
        '<span class="dd-ext-sub">本地杭帮名菜 / 餐厅推荐</span></span>' +
        '<span class="dd-ext-arrow">›</span></a>';
      var storyLink = '<a class="dd-ext-link" href="articles.html?q=' + shortEnc + '">' +
        '<span class="dd-ext-icon">📚</span>' +
        '<span class="dd-ext-text"><span class="dd-ext-title">' + d.name + '人物故事</span>' +
        '<span class="dd-ext-sub">杭州故事库 - ' + shortName + '相关文章</span></span>' +
        '<span class="dd-ext-arrow">›</span></a>';
      var policyHtml = extLink(d.govUrl, '🏛️', '区县政府官网', '政策文件 / 公告公示 / 办事指南');
      var newsHtml = extLink('https://www.baidu.com/s?wd=' + nameEnc + '+最新新闻', '📰', d.name + '新闻', '百度搜索最新资讯');
      var baiduBaike = extLink('https://baike.baidu.com/item/' + shortEnc, '📖', d.name + '百科', '百度百科词条');
      view.innerHTML =
        '<div class="district-detail">' +
          '<div class="dd-hero">' +
            '<a class="dd-back" href="district.html">← 返回列表</a>' +
            '<h1 class="dd-name">' + d.name + '</h1>' +
            '<div class="dd-tag">' + d.tag + '</div>' +
            '<div class="dd-stats">' +
              '<span class="dd-stat">📍 ' + d.area + '</span>' +
              '<span class="dd-stat">👥 ' + d.population + '</span>' +
              '<span class="dd-stat">📮 ' + d.postcode + '</span>' +
              '<span class="dd-stat">' + d.type + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="dd-section">' +
            '<h2>📖 区县概况</h2>' +
            '<div class="dd-desc">' + d.desc + '</div>' +
          '</div>' +
          (highlights ? '<div class="dd-section"><h2>✨ 城市名片</h2><div class="dd-highlights">' + highlights + '</div></div>' : '') +
          '<div class="dd-section">' +
            '<h2>✨ 特色亮点</h2>' +
            '<div class="dd-features">' + d.features + '</div>' +
          '</div>' +
          (scenicHtml ? '<div class="dd-section"><h2>🏞️ 在地景点</h2>' + scenicHtml + '</div>' : '') +
          (landmarks ? '<div class="dd-section"><h2>🏢 重要地标</h2><div class="dd-landmarks">' + landmarks + '</div></div>' : '') +
          '<div class="dd-section dd-ext-group">' +
            '<h2>🔗 在地入口</h2>' +
            '<div class="dd-ext-list">' +
              foodLink + storyLink +
              policyHtml + newsHtml + baiduBaike +
            '</div>' +
          '</div>' +
          '<div class="dd-section">' +
            '<h2>🏛️ 区政府官网</h2>' +
            '<a class="dd-gov-link" href="' + d.govUrl + '" target="_blank" rel="noopener">访问 ' + d.name + '人民政府 →</a>' +
          '</div>' +
          // SEO JSON-LD
          '<script type="application/ld+json">' +
          JSON.stringify({
            "@context": "https://schema.org",
            "@type": "Place",
            "name": d.name,
            "description": d.desc,
            "address": {
              "@type": "PostalAddress",
              "addressRegion": "浙江省杭州市",
              "postalCode": d.postcode
            }
          }) +
          '<\/script>' +
        '</div>';
      document.getElementById('listView').style.display = 'none';
      view.style.display = 'block';
      window.scrollTo(0, 0);
    }

    // 路由：根据 URL hash 或 query 决定显示
    function route() {
      var params = new URLSearchParams(location.search);
      var id = params.get('id');
      var hash = location.hash.replace('#', '');
      var targetId = id || hash;
      if (targetId) {
        var found = allDistricts.find(function (d) { return d.id === targetId; });
        if (found) {
          renderDetail(found);
          document.title = found.name + ' · 杭州 ' + found.type + ' · iHangzhou';
          return;
        } else {
          document.getElementById('listView').style.display = 'none';
          document.getElementById('detailView').style.display = 'block';
          document.getElementById('detailView').innerHTML = '<div class="dd-error">未找到该区县，请返回列表选择</div>';
          return;
        }
      }
      // 列表模式
      document.getElementById('listView').style.display = 'block';
      document.getElementById('detailView').style.display = 'none';
      document.title = '杭州 13 区县导航 · iHangzhou';
    }

    // 内联兜底数据：13 区县完整数据（area/population/postcode/scenic/landmarks/govUrl 全字段）
    function buildFallbackDistricts() { return window.__IHANGZHOU_DISTRICTS__; }

    // 初始化
    function init() {
      // 本地兜底数据已内联（不依赖 API），直接用
      allDistricts = buildFallbackDistricts();
      renderList('all', '');
      route();

      // 筛选
      document.getElementById('filterBar').addEventListener('click', function (e) {
        var btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderList(btn.dataset.type, document.getElementById('headerSearchInput').value);
      });

      // 搜索
      var searchInput = document.getElementById('headerSearchInput');
      searchInput.addEventListener('input', function () {
        var active = document.querySelector('.filter-btn.active');
        renderList(active ? active.dataset.type : 'all', searchInput.value);
      });

      // 路由变化（前进/后退）
      window.addEventListener('popstate', route);

      // 景点卡片点击：弹详情 + 尝试加载图片
      document.getElementById('detailView').addEventListener('click', function (e) {
        var item = e.target.closest('.dd-scenic-item');
        if (!item) return;
        var name = item.getAttribute('data-name');
        var district = item.getAttribute('data-district');
        if (!name) return;
        // 弹详情：高德导航 + 百度攻略
        var amap = 'https://uri.amap.com/marker?position=&name=' + encodeURIComponent(district + name);
        var baidu = 'https://www.baidu.com/s?wd=' + encodeURIComponent(district + name + ' 攻略');
        var html = '<div class="dd-modal-overlay" onclick="if(event.target===this)this.remove()">' +
          '<div class="dd-modal-card">' +
            '<div class="dd-modal-title">' + name + '</div>' +
            '<div class="dd-modal-subtitle">' + district + '</div>' +
            '<a class="dd-modal-btn amap" href="' + amap + '" target="_blank" rel="noopener">📍 高德地图导航</a>' +
            '<a class="dd-modal-btn baidu" href="' + baidu + '" target="_blank" rel="noopener">🔍 百度搜攻略</a>' +
            '<button class="dd-modal-close" onclick="this.closest(\'.dd-modal-overlay\').remove()">关闭</button>' +
          '</div>' +
        '</div>';
        var old = document.querySelector('.dd-modal-overlay');
        if (old) old.remove();
        document.body.insertAdjacentHTML('beforeend', html);
      });

      // 图片懒加载：尝试加载，失败保留占位
      setTimeout(function () {
        document.querySelectorAll('.dd-scenic-img[data-img]').forEach(function (box) {
          var src = box.getAttribute('data-img');
          var img = new Image();
          img.onload = function () {
            box.innerHTML = '';
            box.appendChild(img);
          };
          img.onerror = function () { /* 保留占位 */ };
          img.src = src;
        });
      }, 200);
    }

    init();
  </script>
</body>
</html>
