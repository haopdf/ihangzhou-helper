<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>离线 · iHangzhou</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafbff;
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .offline-icon { font-size: 60px; margin-bottom: 18px; }
    h1 { font-size: 22px; color: #1e293b; margin-bottom: 8px; }
    p { color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="offline-icon">📡</div>
  <h1>网络连接已断开</h1>
  <p>当前处于离线模式，请检查网络连接后重试。<br>已缓存的页面仍可访问。</p>
  <button class="btn" onclick="location.reload()">重新连接</button>
</body>
</html>
