<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="iHangzhou · 周末休闲 - 杭州周末去哪玩？露营、赏花、亲子、展览、市集、骑行、演出、观影一站直达。">
  <meta name="keywords" content="杭州周末,周末去哪,露营,赏花,亲子,展览,市集,骑行,演出">
  <meta name="theme-color" content="#1f7a5a">
  <meta property="og:title" content="周末休闲 · iHangzhou">
  <meta property="og:description" content="杭州周末去哪玩？露营、赏花、亲子、展览、市集、骑行、演出、观影一站直达。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="iHangzhou 杭州生活助手">
  <link rel="manifest" href="manifest.json">
  <title>周末休闲 · iHangzhou 杭州生活助手</title>
  <link rel="stylesheet" href="css/style.css?v=20261018l">
  <script src="js/layout.js?v=20261018l"></script>
  <script src="js/breadcrumb.js?v=20261018l"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
  <style>
    :root{--primary:#1f7a5a;--primary-dark:#15603f}
    .sub-page{max-width:720px;margin:0 auto;padding:0 0 40px}
    .sub-hero{background:linear-gradient(135deg,#1f7a5add,#15603f99);padding:24px 16px 20px;color:#fff;text-align:center}
    .sub-hero-badge{display:inline-block;background:rgba(255,255,255,0.2);padding:4px 12px;border-radius:12px;font-size:12px;margin-bottom:8px;backdrop-filter:blur(4px)}
    .sub-hero h1{font-size:22px;font-weight:700;margin:6px 0 8px;display:flex;align-items:center;justify-content:center;gap:8px}
    .sub-hero h1 .hero-icon{font-size:32px}
    .sub-hero p{font-size:14px;opacity:0.9;line-height:1.6;max-width:480px;margin:0 auto 12px}
    .sub-hero-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;margin:0 auto}
    .sub-hero-tag{background:rgba(255,255,255,0.15);backdrop-filter:blur(4px);padding:5px 10px;border-radius:10px;font-size:12px;color:#fff;display:flex;align-items:center;gap:4px}
    .sub-body{padding:16px;max-width:720px;margin:0 auto}
    .sub-block{margin-bottom:20px}
    .sub-sec-ttl{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:6px;color:var(--text)}
    .sub-third{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(min-width:600px){.sub-third{grid-template-columns:repeat(4,1fr)}}
    .sub-third-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;text-align:center;transition:transform .15s,box-shadow .15s}
    .sub-third-card:active{transform:scale(0.96)}
    .sti{font-size:28px}
    .stn{font-size:13px;color:var(--text);line-height:1.3;font-weight:500}
    .std{font-size:11px;color:var(--text-muted);line-height:1.3}
    .sub-feat{display:flex;flex-direction:column;gap:8px}
    .sub-feat-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:background .15s}
    .sub-feat-card:active{background:var(--bg-hover)}
    .sf-ic{font-size:28px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg-alt);border-radius:10px}
    .sf-bd{flex:1;min-width:0}
    .sf-t{font-size:14px;font-weight:600;color:var(--text);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sf-d{font-size:12px;color:var(--text-muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sf-ar{font-size:18px;color:var(--text-muted);flex-shrink:0}
    .sub-crumb{padding:12px 16px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--bg-alt)}
    .sub-crumb a{color:var(--primary);text-decoration:none;font-weight:500}
    .sub-crumb b{color:var(--text);font-weight:600}
    .sub-crumb .sep{color:var(--text-muted)}
    .sub-back{display:inline-block;padding:10px 20px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;margin-top:12px}
    /* 详情视图 */
    .wk-d{max-width:720px;margin:0 auto;padding:0 0 40px}
    .wk-d-hero{background:linear-gradient(135deg,#1f7a5a,#15603f);color:#fff;padding:28px 16px 24px;text-align:center}
    .wk-d-hero-badge{display:inline-block;padding:4px 12px;border-radius:8px;background:rgba(255,255,255,0.2);font-size:12px;margin-bottom:8px;font-weight:600}
    .wk-d-hero-ico{font-size:40px;line-height:1;margin-bottom:8px}
    .wk-d-hero h1{font-size:22px;font-weight:700;margin:0}
    .wk-d-hero-sub{font-size:14px;opacity:0.9;margin-top:6px}
    .wk-d-body{padding:16px}
    .wk-d-section{padding:14px;background:var(--bg-card);border-radius:12px;margin-bottom:12px}
    .wk-d-section h3{font-size:15px;font-weight:600;margin:0 0 8px}
    .wk-d-section p,.wk-d-section li{font-size:13px;color:var(--text-secondary);line-height:1.7}
    .wk-d-features{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .wk-d-feature{padding:4px 10px;background:var(--bg-alt);border-radius:8px;font-size:11px;color:var(--text-secondary)}
    .wk-d-spot{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-light)}
    .wk-d-spot:last-child{border-bottom:none}
    .wk-d-spot-n{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
    .wk-d-spot-d{font-size:11px;color:var(--text-muted)}
  </style>
</head>
<body>
  <script>
    window.IHZ_PAGE = { title: '周末休闲', icon: '🗓️' };
    window.IZ_SKIP_APP_INIT = true;
  </script>

  <div class="page active" id="pageSub">
    <!-- 面包屑 -->
    <div class="sub-crumb">
      <a href="index.html">首页</a>
      <span class="sep">/</span>
      <a href="travel.html">旅游出行</a>
      <span class="sep">/</span>
      <b>周末休闲</b>
    </div>

    <!-- Hero -->
    <div class="sub-hero">
      <div class="sub-hero-badge">🗓️ 周末休闲</div>
      <h1><span class="hero-icon">🗓️</span> 周末休闲</h1>
      <p>杭州周末去哪玩？精选 8 大主题，总有一种方式属于你</p>
      <div class="sub-hero-tags">
        <span class="sub-hero-tag">🏕️ 露营</span>
        <span class="sub-hero-tag">🌸 赏花</span>
        <span class="sub-hero-tag">👨‍👩‍👧 亲子</span>
        <span class="sub-hero-tag">🖼️ 展览</span>
        <span class="sub-hero-tag">🎪 市集</span>
        <span class="sub-hero-tag">🚴 骑行</span>
        <span class="sub-hero-tag">🎤 演出</span>
        <span class="sub-hero-tag">🎬 观影</span>
      </div>
    </div>

    <!-- 主体内容 -->
    <div class="sub-body" id="wkContent"></div>

    <div style="padding:0 16px">
      <a href="index.html" class="sub-back">← 返回首页</a>
    </div>
  </div>

  <script src="js/zhoumo-data.js"></script>
  <script>
    (function() {
      var DATA = window.ZHOUMO_DATA || {};
      var keys = Object.keys(DATA);
      var params = new URLSearchParams(location.search);
      var detailId = params.get('id');
      var content = document.getElementById('wkContent');

      // 详情视图
      if (detailId && DATA[detailId]) {
        var data = DATA[detailId];
        document.title = data.name + ' · 周末休闲 · 旅游出行 · iHangzhou';
        // 替换面包屑为4级
        var crumb = document.querySelector('.sub-crumb');
        if (crumb) {
          crumb.innerHTML = '<a href="index.html">首页</a><span class="sep">/</span><a href="travel.html">旅游出行</a><span class="sep">/</span><a href="weekend.html">周末休闲</a><span class="sep">/</span><b>' + data.name + '</b>';
        }
        var h = '<div class="wk-d"><div class="wk-d-hero">';
        h += '<div class="wk-d-hero-badge">' + (data.badge || '🎉') + '</div>';
        h += '<div class="wk-d-hero-ico">' + (data.badge || '🎯') + '</div>';
        h += '<h1>' + data.name + '</h1>';
        h += '<div class="wk-d-hero-sub">' + data.subtitle + '</div></div>';
        h += '<div class="wk-d-body">';
        if (data.history) {
          h += '<div class="wk-d-section"><h3>📖 活动介绍</h3><p>' + data.history + '</p></div>';
        }
        if (data.features && data.features.length) {
          h += '<div class="wk-d-section"><h3>✨ 亮点</h3>';
          h += '<div class="wk-d-features">';
          data.features.forEach(function(f){ h += '<span class="wk-d-feature">' + f + '</span>'; });
          h += '</div></div>';
        }
        if (data.spots && data.spots.length) {
          h += '<div class="wk-d-section"><h3>📍 推荐去处</h3>';
          data.spots.forEach(function(s){
            h += '<div class="wk-d-spot"><div><div class="wk-d-spot-n">' + s.n + '</div>';
            if (s.d) h += '<div class="wk-d-spot-d">' + s.d + '</div>';
            h += '</div></div>';
          });
          h += '</div>';
        }
        h += '<div style="text-align:center;margin-top:16px"><a href="weekend.html" class="sub-back">← 返回周末休闲</a></div>';
        h += '</div></div>';
        content.outerHTML = '<div class="wk-d">' + h + '</div>';
        return;
      }

      // 列表视图
      document.title = '周末休闲 · 旅游出行 · iHangzhou';
      var sec = document.createElement('div');
      sec.className = 'sub-block';

      var ttl = document.createElement('div');
      ttl.className = 'sub-sec-ttl';
      ttl.innerHTML = '📂 全部活动主题 <span style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:auto">' + keys.length + ' 个</span>';
      sec.appendChild(ttl);

      var grid = document.createElement('div');
      grid.className = 'sub-third';

      keys.forEach(function(k) {
        var d = DATA[k];
        var a = document.createElement('a');
        a.className = 'sub-third-card';
        a.href = 'weekend.html?id=' + k;
        a.innerHTML = '<span class="sti">' + (d.badge || '🎉') + '</span><span class="stn">' + d.name + '</span><span class="std">' + d.subtitle + '</span>';
        grid.appendChild(a);
      });

      sec.appendChild(grid);
      content.appendChild(sec);

      // 精选推荐
      var featSec = document.createElement('div');
      featSec.className = 'sub-block';
      featSec.innerHTML = '<div class="sub-sec-ttl">⭐ 热门推荐</div>';
      var featWrap = document.createElement('div');
      featWrap.className = 'sub-feat';
      keys.slice(0, 3).forEach(function(k) {
        var d = DATA[k];
        var a = document.createElement('a');
        a.className = 'sub-feat-card';
        a.href = 'weekend.html?id=' + k;
        a.innerHTML = '<span class="sf-ic">' + (d.badge || '🎉') + '</span><span class="sf-bd"><span class="sf-t">' + d.name + '</span><span class="sf-d">' + d.subtitle + '</span></span><span class="sf-ar">›</span>';
        featWrap.appendChild(a);
      });
      featSec.appendChild(featWrap);
      content.appendChild(featSec);
    })();
  </script>
  <script src="js/app.js?v=20261018l"></script>
  <script>IZ.layout.init();</script>
</body>
</html>
