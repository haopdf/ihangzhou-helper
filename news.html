  <style>
    :root{--primary:#e0584f;--primary-dark:#c93a32}
    .sub-page{max-width:720px;margin:0 auto;padding:0 0 40px}
    .sub-hero{background:linear-gradient(135deg,#e0584fdd,#c93a3299);padding:24px 16px 20px;color:#fff;text-align:center}
    .sub-hero-badge{display:inline-block;background:rgba(255,255,255,0.2);padding:4px 12px;border-radius:12px;font-size:12px;margin-bottom:8px;backdrop-filter:blur(4px)}
    .sub-hero h1{font-size:22px;font-weight:700;margin:6px 0 8px;display:flex;align-items:center;justify-content:center;gap:8px}
    .sub-hero h1 .hero-icon{font-size:32px}
    .sub-hero p{font-size:14px;opacity:0.9;line-height:1.6;max-width:480px;margin:0 auto}
    .sub-body{padding:16px}
    .sub-block{margin-bottom:20px}
    .sub-sec-ttl{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:6px;color:var(--text)}
    .sub-more{font-size:12px;font-weight:400;color:var(--text-muted);margin-left:auto}
    .sub-third{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .sub-third-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:transform .15s,box-shadow .15s}
    .sub-third-card:active{transform:scale(0.96)}
    .sti{font-size:28px}
    .stn{font-size:12px;color:var(--text);text-align:center;line-height:1.3}
    .sub-feat{display:flex;flex-direction:column;gap:8px}
    .sub-feat-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:background .15s}
    .sub-feat-card:active{background:var(--bg-hover)}
    .sf-ic{font-size:24px;flex-shrink:0}
    .sf-bd{flex:1;min-width:0}
    .sf-t{font-size:14px;font-weight:600;color:var(--text);display:block}
    .sf-d{font-size:12px;color:var(--text-muted);display:block;margin-top:2px}
    .sf-ar{font-size:20px;color:var(--text-muted);flex-shrink:0}
    .sub-arts{display:flex;flex-direction:column;gap:8px}
    .sub-art{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:background .15s}
    .sub-art:active{background:var(--bg-hover)}
    .sa-t{font-size:14px;font-weight:600;color:var(--text);line-height:1.4}
    .sa-m{font-size:12px;color:var(--text-muted)}
    .sub-empty{text-align:center;padding:20px;color:var(--text-muted);font-size:13px}
    .sub-back{display:inline-block;padding:10px 20px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;margin-top:12px}
    .sub-crumb{padding:12px 16px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--bg-alt)}
    .sub-crumb a{color:var(--primary);text-decoration:none;font-weight:500}
    .sub-crumb b{color:var(--text);font-weight:600}
    .sub-crumb .sep{color:var(--text-muted)}
  </style>
</head>
<body>
  <script>
    window.IHZ_PAGE = { title: '资讯热点', icon: '📰' };
  </script>

  <div class="page active" id="pageSub">
    <!-- 面包屑 -->
    <div class="sub-crumb">
      <a href="index.html">首页</a>
      <span class="sep">/</span>
      <b>资讯热点</b>
    </div>

    <!-- Hero -->
    <div class="sub-hero">
      <div class="sub-hero-badge">📰 资讯热点</div>
      <h1><span class="hero-icon">📰</span> 资讯热点</h1>
      <p>民生政策、消费补贴、活动汇总、限行天气油价——杭州热点一手掌握。</p>
    </div>

    <!-- 内容区 -->
    <div class="sub-body">
      <!-- 子栏目 -->
      <div class="sub-block">
        <div class="sub-sec-ttl">📂 子栏目 <span class="sub-more">8 个</span></div>
        <div class="sub-third">
          <a class="sub-third-card" href="news-zhengce.html"><span class="sti">📢</span><span class="stn">民生政策</span></a>
          <a class="sub-third-card" href="news-butie.html"><span class="sti">🎫</span><span class="stn">消费补贴</span></a>
          <a class="sub-third-card" href="news-huodong.html"><span class="sti">🎉</span><span class="stn">活动汇总</span></a>
          <a class="sub-third-card" href="news-xianxing.html"><span class="sti">🚗</span><span class="stn">今日限行</span></a>
          <a class="sub-third-card" href="news-tianqi.html"><span class="sti">⛈️</span><span class="stn">天气预警</span></a>
          <a class="sub-third-card" href="news-youjia.html"><span class="sti">⛽</span><span class="stn">油价查询</span></a>
          <a class="sub-third-card" href="news-wxfeed.html"><span class="sti">📱</span><span class="stn">公众号精选</span></a>
          <a class="sub-third-card" href="articles.html"><span class="sti">📚</span><span class="stn">全部文章</span></a>
        </div>
      </div>

      <!-- 精选内容 -->
      <div class="sub-block">
        <div class="sub-sec-ttl">⭐ 精选内容</div>
        <div class="sub-feat">
          <a class="sub-feat-card" href="news-zhengce.html">
            <span class="sf-ic">📢</span>
            <span class="sf-bd"><span class="sf-t">杭州社保公积金新政</span><span class="sf-d">2026 年最新政策解读</span></span>
            <span class="sf-ar">›</span>
          </a>
          <a class="sub-feat-card" href="news-huodong.html">
            <span class="sf-ic">🎉</span>
            <span class="sf-bd"><span class="sf-t">2026 国庆活动全整理</span><span class="sf-d">烟花 · 灯会 · 音乐节</span></span>
            <span class="sf-ar">›</span>
          </a>
          <a class="sub-feat-card" href="news-butie.html">
            <span class="sf-ic">🎫</span>
            <span class="sf-bd"><span class="sf-t">杭州消费券领取攻略</span><span class="sf-d">以旧换新 · 家电补贴</span></span>
            <span class="sf-ar">›</span>
          </a>
        </div>
      </div>

      <!-- 相关文章 -->
      <div class="sub-block">
        <div class="sub-sec-ttl">📖 相关文章 <span class="sub-more" id="subArtCount"></span></div>
        <div class="sub-arts" id="subArts"><div class="sub-empty">正在加载相关文章…</div></div>
      </div>
    </div>

    <!-- 返回首页 -->
    <div style="padding:0 16px">
      <a href="index.html" class="sub-back">← 返回首页</a>
    </div>
  </div>

  <script src="js/app.js?v=20261018l"></script>
  <script>
    IZ.layout.init();
    (function() {
      var KW = ['民生','政策','社保','补贴','活动','限行','天气','油价','消费','优惠'];
      var countEl = document.getElementById('subArtCount');
      var box = document.getElementById('subArts');
      fetch('articles/index.json')
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(function(list) {
          var scored = [];
          list.forEach(function(a) {
            var title = a.title || '', catg = a.cat || '', sum = a.summary || '';
            var sc = 0;
            KW.forEach(function(k) {
              if (title.indexOf(k) >= 0) sc += 3;
              else if (catg.indexOf(k) >= 0) sc += 2;
              else if (sum.indexOf(k) >= 0) sc += 1;
            });
            if (sc > 0) scored.push({ a: a, sc: sc });
          });
          scored.sort(function(x, y) {
            if (y.sc !== x.sc) return y.sc - x.sc;
            return (y.a.words || 0) - (x.a.words || 0);
          });
          var top = scored.slice(0, 12);
          if (countEl) countEl.textContent = top.length ? '共 ' + scored.length + ' 篇匹配' : '';
          if (!top.length) {
            box.innerHTML = '<div class="sub-empty">暂无匹配文章，试试上方子栏目入口</div>';
            return;
          }
          box.innerHTML = top.map(function(o) {
            var a = o.a;
            return '<a class="sub-art" href="articles/' + encodeURIComponent(a.slug) + '.html">' +
              '<span class="sa-t">' + (a.title || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span>' +
              '<span class="sa-m">' + (a.cat || '') + ' · ' + (a.words || 0) + ' 字</span></a>';
          }).join('');
        })
        .catch(function() {
          if (box) box.innerHTML = '<div class="sub-empty">文章加载失败，请稍后重试</div>';
        });
    })();
  </script>
</body>
</html>
