  <script>
    // 旅游出行频道专题页（结构化：与首页「🧭 旅游出行」8 大分类一一对应）
    (function () {
      'use strict';

      var CHANNEL_ID = 'travel';
      var CHANNEL_COLOR = '#1f7a5a';

      // 相关频道推荐（仅使用 data-categories.js 中存在且有 HTML 页面的频道）
      var RELATED = {
        'travel': ['weekend', 'museum', 'temple', 'street'],
        'weekend': ['travel', 'museum', 'food', 'street'],
        'museum': ['travel', 'history', 'weekend', 'temple'],
        'food': ['laozihao', 'street', 'coffee', 'travel'],
        'temple': ['travel', 'museum', 'history', 'weekend'],
        'street': ['food', 'coffee', 'history', 'travel'],
        'history': ['weekend', 'museum', 'travel', 'temple'],
        'coffee': ['street', 'weekend', 'food', 'travel'],
        'laozihao': ['food', 'street', 'history', 'travel']
      };

      // 区县全称（与 layout.js 一致；window.DISTRICTS 存在时优先）
      var DISTRICT_NAMES = {
        hangzhou: '杭州市', shangcheng: '上城区', gongshu: '拱墅区', xihu: '西湖区',
        binjiang: '滨江区', xiaoshan: '萧山区', yuhang: '余杭区', linping: '临平区',
        qiantang: '钱塘区', fuyang: '富阳区', linan: '临安区', tonglu: '桐庐县',
        chunan: '淳安县', jiande: '建德市'
      };

      // ---- 数据源：js/cat-data.min.js（与首页 catGrid 同一份数据） ----
      var CATS = Array.isArray(window.CAT_DATA) ? window.CAT_DATA : [];
      var CAT = null;
      for (var ci = 0; ci < CATS.length; ci++) {
        if (CATS[ci].k === CHANNEL_ID) { CAT = CATS[ci]; break; }
      }

      var T = { city: 'hangzhou' };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function $(id) { return document.getElementById(id); }
      function districtFull(id) {
        if (window.DISTRICTS) {
          var d = window.DISTRICTS.find(function (x) { return x.id === id; });
          if (d) return d.full;
        }
        return DISTRICT_NAMES[id] || id;
      }

      // 链接属性：#act: 站内动作 / 外链新窗口 / 站内直链
      function hrefAttrs(u) {
        u = (u || '').trim();
        if (/^#act:/.test(u)) return 'data-act="' + esc(u.slice(5)) + '" href="javascript:void(0)"';
        if (/^javascript:/i.test(u)) return 'href="' + esc(u) + '"';
        if (/^https?:\/\//i.test(u)) return 'href="' + esc(u) + '" target="_blank" rel="noopener noreferrer"';
        return 'href="' + esc(u) + '"';
      }

      // 区县推断（与频道页网格一致的文本推断逻辑）
      function inferDistricts(text) {
        var ds = [];
        if (/西溪|西湖|断桥|苏堤|白堤|灵隐|法喜|雷峰|保俶|六和|净慈|花港|曲院|平湖秋月|柳浪|双峰|北山街|南山路|之江|宋城/.test(text)) ds.push('xihu');
        if (/河坊街|南宋御街|吴山|武林|湖滨|馒头山/.test(text)) ds.push('shangcheng');
        if (/拱宸桥|运河|小河|大兜路/.test(text)) ds.push('gongshu');
        if (/滨江|网易|阿里/.test(text)) ds.push('binjiang');
        if (/萧山|湘湖/.test(text)) ds.push('xiaoshan');
        if (/余杭|良渚|径山|梦想小镇|塘栖/.test(text)) ds.push('yuhang');
        if (/临平/.test(text)) ds.push('linping');
        if (/下沙/.test(text)) ds.push('qiantang');
        if (/富阳|龙门/.test(text)) ds.push('fuyang');
        if (/临安|天目|大明山/.test(text)) ds.push('linan');
        if (/桐庐|瑶琳|深澳/.test(text)) ds.push('tonglu');
        if (/千岛湖|淳安|建德|新安江|严州|大慈岩/.test(text)) ds.push('chunan');
        if (ds.length === 0) ds = ['hangzhou'];
        ds.push('hangzhou');
        return ds;
      }

      // ---------------- 头部 / 描述 ----------------
      function renderHeader() {
        var el = $('channelHeader');
        if (!el) return;
        if (!CAT) {
          el.innerHTML = '<div style="text-align:center;padding: 40px 16px;color:var(--text-muted);">栏目数据加载失败，请刷新重试</div>';
          return;
        }
        el.innerHTML =
          '<div class="ch-hero" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;text-align:center;">' +
          '<div style="font-size:56px;line-height:1;margin-bottom:8px;">' + CAT.ic + '</div>' +
          '<h1 style="font-size:24px;font-weight:700;margin:0;">' + esc(CAT.n) + '</h1>' +
          '<div style="font-size:13px;opacity:.9;margin-top:6px;">' + esc(CAT.d || '') + '</div>' +
          '<div style="font-size:12px;opacity:.75;margin-top:4px;">iHangzhou · 杭州生活助手</div>' +
          '</div>';
      }

      function renderDesc() {
        var el = $('channelDesc');
        if (!el) return;
        var intro = CAT ? (CAT.i || '') : '杭州旅游全攻略一站直达。';
        var chips = '';
        if (CAT) {
          chips += CAT.subs.map(function (s) {
            return '<a href="#sec-' + esc(s.k) + '">' + s.ic + ' ' + esc(s.n) + '</a>';
          }).join('');
        }
        var kw = (CAT && CAT.kw ? CAT.kw : ['西湖', '灵隐寺', '西溪湿地', '千岛湖']).slice(0, 4).map(function (k) {
          return '<a href="articles.html?q=' + encodeURIComponent(k) + '">📚 ' + esc(k) + '</a>';
        }).join('');
        el.innerHTML =
          '<div style="padding:16px;background:var(--bg-card);border-radius:0 0 12px 12px;margin:0 16px;font-size:14px;line-height:1.7;color:var(--text-secondary);">' +
          esc(intro) +
          '<div class="trv-chipnav">' + chips + kw + '</div>' +
          '<div id="cityTip"></div>' +
          '</div>';
      }

      // ---------------- 8 大分类区块 ----------------
      function renderSections() {
        var wrap = $('travelSections');
        if (!wrap) return;
        if (!CAT) { wrap.innerHTML = ''; var t = $('sectionsTip'); if (t) t.textContent = ''; return; }
        var total = 0;
        wrap.innerHTML = CAT.subs.map(function (sub) {
          var entries = sub.th || [];
          var feats = sub.ft || [];
          total += entries.length;
          var subUrl = 'cat.html?c=' + encodeURIComponent(CHANNEL_ID) + '&s=' + encodeURIComponent(sub.n);
          return '<div class="trv-sub" id="sec-' + esc(sub.k) + '">' +
            '<a class="trv-sub-hd" href="' + esc(subUrl) + '" style="--ci:' + CHANNEL_COLOR + '">' +
            '<span class="trv-sub-ic">' + sub.ic + '</span>' +
            '<span class="trv-sub-bd">' +
            '<span class="trv-sub-n">' + esc(sub.n) + '</span>' +
            '<span class="trv-sub-d">' + esc(sub.d || '') + '</span>' +
            '</span>' +
            '<span class="trv-sub-go">进入二级栏目 ›</span>' +
            '</a>' +
            '<div class="cat-third">' +
            entries.map(function (t3) {
              return '<a class="cat-third-card trv-entry" data-name="' + esc(t3[1]) + '" data-sub="' + esc(sub.k) + '" ' + hrefAttrs(t3[2]) + '>' +
                '<span class="cti">' + t3[0] + '</span><span class="ctn">' + esc(t3[1]) + '</span></a>';
            }).join('') +
            '</div>' +
            (feats.length ?
              '<div class="cat-feat">' +
              feats.map(function (f) {
                return '<a class="cat-feat-card trv-feat" data-name="' + esc(f[1]) + '" ' + hrefAttrs(f[3]) + '>' +
                  '<span class="cf-ic">' + f[0] + '</span>' +
                  '<span class="cf-bd"><span class="cf-t">' + esc(f[1]) + '</span>' +
                  '<span class="cf-d">' + esc(f[2]) + '</span></span>' +
                  '<span class="cf-ar">›</span></a>';
              }).join('') +
              '</div>' : '') +
            '</div>';
        }).join('');
        var tip = $('sectionsTip');
        if (tip) tip.textContent = CAT.subs.length + ' 大分类 · ' + total + ' 个入口';
      }

      // ---------------- 切换全部分类 ----------------
      function renderCatNav() {
        var el = $('catNav');
        if (!el || !CATS.length) return;
        el.innerHTML = CATS.map(function (c) {
          var on = c.k === CHANNEL_ID ? ' on' : '';
          return '<a class="cat-subnav-btn' + on + '" href="cat.html?c=' + encodeURIComponent(c.k) + '" style="--ci:' + esc(c.c || CHANNEL_COLOR) + '">' + c.ic + ' ' + esc(c.n) + '</a>';
        }).join('');
      }

      // ---------------- 全部景点服务网格 ----------------
      function renderGrid() {
        if (!window._getData) return;
        var DATA = window._getData();
        var category = DATA.categories.find(function (c) { return c.id === CHANNEL_ID; });
        if (!category) return;

        // 当前区县（URL 参数优先，其次 localStorage）
        var params = new URLSearchParams(location.search);
        T.city = params.get('city') || (function () { try { return localStorage.getItem('ihz_city') || 'hangzhou'; } catch (e) { return 'hangzhou'; } })();
        var cityObj = (T.city !== 'hangzhou' && window.DISTRICTS) ? window.DISTRICTS.find(function (d) { return d.id === T.city; }) : null;
        var cityPrefix = T.city !== 'hangzhou' ? districtFull(T.city) + ' · ' : '';

        // 网格：按区县过滤（文本推断，与分类入口筛选口径一致）
        var filteredItems = category.items;
        if (T.city !== 'hangzhou') {
          filteredItems = category.items.filter(function (item) {
            var text = (item.name || '') + ' ' + (item.desc || '') + ' ' + (item.detail || '');
            return inferDistricts(text).indexOf(T.city) >= 0;
          });
        }

        // 标题与数量
        $('channelTitle').textContent = cityPrefix + '全部景点服务';
        $('channelCount').textContent = T.city !== 'hangzhou' ?
          filteredItems.length + ' 项匹配 ' + districtFull(T.city) :
          ('共 ' + category.items.length + ' 项');

        var grid = $('serviceGrid');
        if (!grid) return;

        // 切了区县但无匹配时的提示
        if (T.city !== 'hangzhou' && filteredItems.length === 0) {
          grid.innerHTML =
            '<div style="grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--text-muted);font-size:14px;">' +
            '本区暂无标记旅游景点，<a href="javascript:void(0)" data-act="clear-city" style="color:var(--primary);">查看全市旅游 →</a>' +
            '</div>';
          return;
        }

        // 网格渲染（保留无 url 条目的 data-action 交互，由 app.js 的 IZ_INIT_CHANNEL_PAGE 处理）
        grid.innerHTML = filteredItems.map(function (item) {
          // 景点类 item 优先跳 scenic.html?id=xxx 站内详情页（含门票/交通/贴士）
          var linkUrl = item.url || '';
          if (window.SCENIC_DATA) {
            var matchedId = null;
            Object.keys(window.SCENIC_DATA).forEach(function (id) {
              var v = window.SCENIC_DATA[id];
              if (v && v.name === item.name) matchedId = id;
            });
            if (matchedId) linkUrl = 'scenic.html?id=' + encodeURIComponent(matchedId);
          }
          if (linkUrl) {
            var isExt = /^https?:\/\//i.test(linkUrl);
            var extAttr = isExt ? ' target="_blank" rel="noopener noreferrer"' : '';
            return '<a class="sitem" href="' + linkUrl + '"' + extAttr + '>' +
              '<div class="sicon">' + (getServiceIcon(item.name) || '📌') + '</div>' +
              '<div class="sinfo">' +
              '<div class="sname">' + item.name + '</div>' +
              '<div class="sdesc">' + item.desc + '</div>' +
              '</div>' +
              '<div class="sarrow">›</div>' +
              '</a>';
          }
          return '<div class="sitem" data-action="' + (item.action || '') + '" data-url="">' +
            '<div class="sicon">' + (getServiceIcon(item.name) || '📌') + '</div>' +
            '<div class="sinfo">' +
            '<div class="sname">' + item.name + '</div>' +
            '<div class="sdesc">' + item.desc + '</div>' +
            '</div>' +
            '<div class="sarrow">›</div>' +
            '</div>';
        }).join('');
      }

      function getServiceIcon(name) {
        if (window.getServiceIcon) return window.getServiceIcon(name);
        return '📌';
      }

      // ---------------- 相关文章 ----------------
      function fetchRelatedArticles() {
        var el = $('relatedArticles');
        if (!el) return;
        var chips = (CAT && CAT.kw ? CAT.kw : ['旅游', '景点', '西湖']).slice(0, 3);
        var allChips = chips.slice();
        if (CAT) allChips.unshift(CAT.n);

        // 相关文章：优先服务端按需过滤（q=关键词）；接口不可用/失败时回退全量 index.json
        var q = encodeURIComponent(allChips.filter(function (k) { return k; }).join(','));
        var loadRelated = fetch('/api/articles-index?q=' + q + '&limit=5').then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }).then(function (res) {
          if (res && res.success && Array.isArray(res.data)) return res.data;
          throw new Error('api unavailable');
        }).catch(function () {
          return fetch('articles/index.json').then(function (r) { return r.json(); }).then(function (list) {
            var out = [];
            list.forEach(function (a) {
              for (var i = 0; i < allChips.length; i++) {
                var kw = allChips[i];
                if (!kw) continue;
                if (a.title.indexOf(kw) >= 0 || a.summary.indexOf(kw) >= 0 || a.cat.indexOf(kw) >= 0) { out.push(a); break; }
              }
            });
            return out.slice(0, 5);
          });
        });
        loadRelated.then(function (matched) {
          if (!matched.length) { el.innerHTML = ''; return; }
          el.innerHTML =
            '<div class="section-head" style="margin-top:24px;padding:0 16px;">' +
            '<h2>📚 相关杭州故事</h2>' +
            '<span class="tip">共 ' + matched.length + ' 篇</span>' +
            '</div>' +
            '<div style="padding: 0 16px;">' +
            matched.map(function (a) {
              return '<a href="articles/' + a.slug + '.html" style="display:block;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:10px;margin-bottom:8px;text-decoration:none;color:inherit;">' +
                '<div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;">' + a.title + '</div>' +
                '<div style="font-size:12px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' + a.summary + '</div>' +
                '</a>';
            }).join('') +
            '<a href="articles.html" style="display:block;text-align:center;padding:12px;background:var(--bg-alt);border-radius:10px;color:var(--primary);font-size:13px;text-decoration:none;font-weight:500;margin-top:8px;">📖 查看全部杭州故事 →</a>' +
            '</div>';
        }).catch(function () { /* 静默失败 */ });
      }

      function renderRelatedChannels() {
        var related = RELATED[CHANNEL_ID] || [];
        var relEl = $('relatedChannels');
        if (!relEl || !related.length) return;
        var DATA = window._getData ? window._getData() : null;
        if (!DATA) return;
        relEl.innerHTML = related.map(function (rid) {
          var rcat = DATA.categories.find(function (c) { return c.id === rid; });
          if (!rcat) return '';
          return '<a class="p-neighbor" href="' + rid + '.html">' +
            '<span class="ch-icon">' + rcat.icon + '</span>' +
            '<span class="ch-name">' + rcat.name + '</span>' +
            '</a>';
        }).join('');
      }

      // ---------------- 搜索 / 区县筛选 ----------------
      function districtHit(el) {
        var sub = el.getAttribute('data-sub') || '';
        var name = el.getAttribute('data-name') || '';
        return inferDistricts(name + ' ' + sub).indexOf(T.city) >= 0;
      }

      function applyFilters() {
        var input = $('headerSearchInput');
        var q = input && input.value ? input.value.trim().toLowerCase() : '';

        // 分类区块（入口卡 + 精选卡）
        var subs = document.querySelectorAll('.trv-sub');
        for (var i = 0; i < subs.length; i++) {
          var block = subs[i];
          var any = false;
          var entries = block.querySelectorAll('.trv-entry');
          for (var j = 0; j < entries.length; j++) {
            var el = entries[j];
            var name = (el.getAttribute('data-name') || '').toLowerCase();
            var hit = !q || name.indexOf(q) >= 0;
            var distOk = T.city === 'hangzhou' || districtHit(el);
            if (hit && distOk) any = true;
            el.style.display = (hit && distOk) ? '' : 'none';
          }
          var third = block.querySelector('.cat-third');
          if (third) third.style.display = any ? '' : 'none';
          var feats = block.querySelectorAll('.trv-feat');
          for (var k = 0; k < feats.length; k++) {
            var f = feats[k];
            var fname = (f.getAttribute('data-name') || '').toLowerCase();
            var fhit = !q || fname.indexOf(q) >= 0;
            f.style.display = fhit ? '' : 'none';
            if (fhit) any = true;
          }
          block.style.display = any ? '' : 'none';
        }

        // 全部景点服务网格
        var grid = $('serviceGrid');
        if (grid) {
          grid.querySelectorAll('.sitem').forEach(function (el) {
            var name = el.querySelector('.sname') ? el.querySelector('.sname').textContent.toLowerCase() : '';
            var desc = el.querySelector('.sdesc') ? el.querySelector('.sdesc').textContent.toLowerCase() : '';
            el.style.display = (!q || name.indexOf(q) >= 0 || desc.indexOf(q) >= 0) ? 'flex' : 'none';
          });
        }

        renderCityTip();
      }

      function renderCityTip() {
        var el = $('cityTip');
        if (!el) return;
        if (T.city && T.city !== 'hangzhou') {
          el.innerHTML = '<span>📍 已按区县筛选：<strong>' + esc(districtFull(T.city)) + '</strong>，分类入口与景点服务仅显示相关项</span>' +
            '<a href="javascript:void(0)" id="cityClear">清除筛选 ×</a>';
          var clr = $('cityClear');
          if (clr) clr.addEventListener('click', function (e) {
            e.preventDefault();
            try { localStorage.setItem('ihz_city', 'hangzhou'); } catch (ex) {}
            setCity('hangzhou', false);
          });
        } else {
          el.innerHTML = '';
        }
      }

      // ---------------- 区县切换 ----------------
      function setCity(id, push) {
        T.city = id || 'hangzhou';
        try { localStorage.setItem('ihz_city', T.city); } catch (e) {}
        var url = T.city === 'hangzhou' ? 'travel.html' : 'travel.html?city=' + encodeURIComponent(T.city);
        try {
          if (push && window.history.pushState) window.history.pushState({ city: T.city }, '', url);
          else window.history.replaceState({ city: T.city }, '', url);
        } catch (e) {}
        renderGrid();
        applyFilters();
        syncCityName();
      }

      function syncCityName() {
        var el = $('cityName');
        if (!el) return;
        el.textContent = districtFull(T.city);
        var box = $('cityDropdown');
        if (!box) return;
        box.querySelectorAll('.city-dropdown-item').forEach(function (it) {
          it.classList.toggle('active', it.getAttribute('data-id') === T.city);
        });
      }

      // 覆盖 layout.js 的区县跳转：在 travel.html 上切换区县时不跳走，仅更新筛选
      function overrideCityDropdown() {
        var box = $('cityDropdown');
        if (!box || box._travelCaptureBound) return;
        box._travelCaptureBound = true;
        // capture 阶段拦截（优先于 layout.js 的冒泡默认跳转）
        box.addEventListener('click', function (e) {
          var item = e.target.closest ? e.target.closest('.city-dropdown-item') : null;
          if (!item) return;
          e.preventDefault();
          e.stopPropagation();
          var id = item.getAttribute('data-id') || 'hangzhou';
          setCity(id, true);
        }, true);
      }

      // 浏览器后退/前进时重新渲染（与 pushState 配合）
      window.addEventListener('popstate', function () {
        var p = new URLSearchParams(location.search).get('city') || 'hangzhou';
        T.city = p;
        renderGrid();
        applyFilters();
        syncCityName();
      });

      // 顶部"‹"返回按钮：用 history.back()，与浏览器后退行为一致
      function overrideBackButton() {
        var btn = document.querySelector('.topbar-back');
        if (!btn) return;
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = 'index.html';
          }
        });
      }

      // ---------------- 站内动作（#act:xxx） ----------------
      document.addEventListener('click', function (e) {
        var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
        if (!el) return;
        e.preventDefault();
        var act = el.getAttribute('data-act');
        if (!act) return;
        if (act === 'tide' && window.showTide) { window.showTide(); return; }
        if (act === 'clear-city') {
          try { localStorage.setItem('ihz_city', 'hangzhou'); } catch (e) {}
          setCity('hangzhou', false);
          return;
        }
        if (window._handleAction) window._handleAction(act);
      }, false);

      // 顶栏搜索框：页面内即时过滤（不动跳转逻辑）
      document.body.addEventListener('input', function (e) {
        if (!e.target || e.target.id !== 'headerSearchInput') return;
        applyFilters();
      });

      // ---------------- 渲染入口 ----------------
      function renderChannel() {
        renderHeader();
        renderDesc();
        renderSections();
        renderCatNav();
        renderGrid();
        applyFilters();
        renderRelatedChannels();
        fetchRelatedArticles();
      }

      function startChannelPage() {
        if (window._ensureCategories) window._ensureCategories().then(initPage);
        else initPage();
      }
      function initPage() {
        renderChannel();
        syncCityName();
        overrideCityDropdown();
        overrideBackButton();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startChannelPage);
      } else {
        startChannelPage();
      }

      // 频道页专用初始化（网格点击 + modal 关闭）
      if (window.IZ_INIT_CHANNEL_PAGE) window.IZ_INIT_CHANNEL_PAGE();
    })();
  </script>
  <script>
    if (window.IZ && IZ.layout) {
      document.addEventListener("DOMContentLoaded", IZ.layout.init);
    }
  </script>

</body>

</html>
