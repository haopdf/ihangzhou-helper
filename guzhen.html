<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>古镇详情 · iHangzhou</title>
  <meta name="theme-color" content="#8b5cf6">
  <link rel="stylesheet" href="css/style.css?v=20261013c">
  <script src="js/layout.js"></script>
  <script src="js/guzhen-data.js"></script>
  <style>
    .guzhen-hero {
      position: relative;
      width: 100%;
      height: 240px;
      overflow: hidden;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    }
    .guzhen-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }
    .guzhen-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 30%, rgba(0,0,0,0.6));
    }
    .guzhen-hero .guzhen-title-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px;
      z-index: 2;
      color: #fff;
    }
    .guzhen-hero .guzhen-name {
      font-size: 26px;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .guzhen-hero .guzhen-sub {
      font-size: 13px;
      opacity: 0.92;
      margin-top: 4px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .guzhen-body { padding: 16px; }
    .guzhen-badge {
      display: inline-block;
      font-size: 12px;
      padding: 4px 10px;
      background: #ede9fe;
      color: #6d28d9;
      border-radius: 10px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .guzhen-info-grid {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 12px 0 16px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .guzhen-info-row {
      display: flex;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-card);
    }
    .guzhen-info-row:last-child { border-bottom: none; }
    .guzhen-info-row .gi-ik {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      min-width: 56px;
      flex-shrink: 0;
    }
    .guzhen-info-row .gi-iv {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
    }
    .guzhen-section { margin: 20px 0 8px; }
    .guzhen-section h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 10px;
      padding-left: 8px;
      border-left: 3px solid #8b5cf6;
    }
    .guzhen-section p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.8;
    }
    .guzhen-highlights { display: flex; flex-direction: column; gap: 6px; }
    .guzhen-hl-item {
      font-size: 13px;
      color: var(--text);
      padding: 8px 12px;
      background: var(--bg);
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }
    .guzhen-hl-item::before {
      content: '\2713';
      color: #8b5cf6;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .guzhen-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .guzhen-empty .ei-big { font-size: 64px; margin-bottom: 16px; }
    .guzhen-empty h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .guzhen-nearby { margin-top: 24px; border-top: 8px solid var(--bg); padding-top: 16px; }
    .guzhen-nearby h3 { font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 12px; }
    .guzhen-nearby-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .guzhen-nearby-card {
      display: flex; align-items: center; gap: 8px;
      padding: 10px; background: var(--bg); border-radius: 8px;
      text-decoration: none; color: var(--text); font-size: 13px; font-weight: 500;
    }
    .guzhen-nearby-card:active { opacity: 0.7; }
    .guzhen-nearby-card .nc-ic { font-size: 20px; }
    @media (min-width: 768px) {
      .guzhen-hero { height: 340px; }
      .guzhen-body { max-width: 720px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <script>
    window.IHZ_PAGE = { title: '\u53e4镇古村', icon: '\ud83c\udfd9\ufe0f' };
    window.IZ_SKIP_APP_INIT = true;
    window.IZ_SKIP_APP_THEME = true;
  </script>

  <div id="guzhenContainer">
    <div class="guzhen-empty">
      <div class="ei-big">\ud83c\udfd9\ufe0f</div>
      <h2>\u52a0\u8f7d\u4e2d...</h2>
    </div>
  </div>

  <script>
    /* \u53e4\u9547\u53e4\u6751\u901a\u7528\u8be6\u60c5\u9875 \u2014 guzhen.html?id=tangqi */
    function renderGuzhen(id) {
      var data = window.GUZHEN_VILLAGES ? window.GUZHEN_VILLAGES[id] : null;
      var container = document.getElementById('guzhenContainer');
      var headerTitle = document.getElementById('headerTitle');

      if (!data) {
        container.innerHTML = '<div class="guzhen-empty">' +
          '<div class="ei-big">\ud83c\udfd9\ufe0f</div>' +
          '<h2>\u672a\u627e\u5230\u8be5\u53e4\u9547/\u53e4\u6751</h2>' +
          '<p style="margin:8px 0 16px;">ID: ' + (id || '(\u7a7a)') + '</p>' +
          '<a href="cat.html?c=travel&s=%E5%8F%A4%E9%95%87%E5%8F%A4%E6%9D%91" class="btn" style="display:inline-block;padding:10px 20px;background:#8b5cf6;color:#fff;border-radius:8px;text-decoration:none;font-size:14px;">\u2190 \u8fd4\u56de\u53e4\u9547\u5217\u8868</a>' +
          '<a href="travel.html" class="btn" style="display:inline-block;padding:10px 20px;background:var(--primary);color:#fff;border-radius:8px;text-decoration:none;font-size:14px;margin-left:8px;">\u65c5\u6e38\u9996\u9875</a>' +
          '</div>';
        if (headerTitle) headerTitle.textContent = '\ud83c\udfd9\ufe0f \u53e4\u9547\u53e4\u6751';
        return;
      }

      document.title = data.name + ' \u00b7 \u676d\u5dde\u53e4\u9547 \u00b7 iHangzhou';
      if (headerTitle) headerTitle.textContent = '\ud83c\udfd9\ufe0f ' + data.name;

      var html = '';

      /* ---- Hero ---- */
      html += '<div class="guzhen-hero">';
      if (data.image) {
        html += '<img src="' + data.image + '" alt="' + data.name + '" loading="lazy" onerror="this.style.display=\'none\'">';
      }
      html += '<div class="guzhen-title-bar">' +
        '<div class="guzhen-name">' + data.name + '</div>' +
        '<div class="guzhen-sub">' + data.subtitle + '</div>' +
        '</div></div>';

      html += '<div class="guzhen-body">';

      /* ---- Badge + \u5b63\u8282 ---- */
      html += '<div class="guzhen-badge">' + data.badge + '</div>';
      html += '<span style="float:right;font-size:12px;color:var(--text-muted);margin-bottom:8px;display:inline-block;">\u6700\u4f73\u65f6\u8282\uff1a' + data.seasons + '</span>';
      html += '<div style="clear:both"></div>';

      /* ---- \u5b9e\u7528\u4fe1\u606f ---- */
      html += '<div class="guzhen-info-grid">';
      if (data.location) html += '<div class="guzhen-info-row"><span class="gi-ik">\ud83d\udccd \u5730\u5740</span><span class="gi-iv">' + data.location + '</span></div>';
      if (data.ticket) html += '<div class="guzhen-info-row"><span class="gi-ik">\ud83c\udfab \u95e8\u7968</span><span class="gi-iv">' + data.ticket + '</span></div>';
      if (data.hours) html += '<div class="guzhen-info-row"><span class="gi-ik">\ud83d\udd50 \u65f6\u95f4</span><span class="gi-iv">' + data.hours + '</span></div>';
      if (data.traffic) html += '<div class="guzhen-info-row"><span class="gi-ik">\ud83d\ude97 \u4ea4\u901a</span><span class="gi-iv">' + data.traffic + '</span></div>';
      html += '</div>';

      /* ---- \u4eae\u70b9 ---- */
      if (data.highlights && data.highlights.length) {
        html += '<div class="guzhen-section"><h3>\u2728 \u5fc5\u6e38\u4eae\u70b9</h3><div class="guzhen-highlights">';
        data.highlights.forEach(function(h) {
          html += '<div class="guzhen-hl-item">' + h + '</div>';
        });
        html += '</div></div>';
      }

      /* ---- \u8be6\u7ec6\u4ecb\u7ecd ---- */
      html += '<div class="guzhen-section"><h3>\ud83d\udcd6 \u53e4\u9547\u4ecb\u7ecd</h3><p>' + data.guide + '</p></div>';

      /* ---- \u5176\u4ed6\u53e4\u9547\u63a8\u8350 ---- */
      var allKeys = window.GUZHEN_VILLAGES ? Object.keys(window.GUZHEN_VILLAGES) : [];
      var nearby = allKeys.filter(function(k) { return k !== id; }).slice(0, 4);
      if (nearby.length) {
        html += '<div class="guzhen-nearby"><h3>\ud83c\udfd8\ufe0f \u5176\u4ed6\u53e4\u9547\u63a8\u8350</h3><div class="guzhen-nearby-grid">';
        nearby.forEach(function(k) {
          var v = window.GUZHEN_VILLAGES[k];
          html += '<a class="guzhen-nearby-card" href="guzhen.html?id=' + k + '">' +
            '<span class="nc-ic">' + v.badge.split(' ')[0] + '</span>' +
            '<span>' + v.name + '</span></a>';
        });
        html += '</div></div>';
      }

      /* ---- \u8fd4\u56de\u5bfc\u822a ---- */
      html += '<div style="margin-top:24px;display:flex;gap:10px;">' +
        '<a href="cat.html?c=travel&s=%E5%8F%A4%E9%95%87%E5%8F%A4%E6%9D%91" style="flex:1;text-align:center;padding:12px;background:#8b5cf6;color:#fff;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;">\u2190 \u53e4\u9547\u5217\u8868</a>' +
        '<a href="travel.html" style="flex:1;text-align:center;padding:12px;background:var(--primary);color:#fff;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;">\u65c5\u6e38\u9996\u9875</a>' +
        '</div>';

      html += '</div>';
      container.innerHTML = html;
    }

    (function () {
      var id = location.search.split('id=')[1] || '';
      id = id.split('&')[0];
      renderGuzhen(decodeURIComponent(id));
    })();
  </script>
  <script>
    if (window.IZ && IZ.layout) {
      document.addEventListener('DOMContentLoaded', IZ.layout.init);
    }
  </script>
</body>
</html>
