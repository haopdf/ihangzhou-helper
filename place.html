<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>杭州地点详情 · iHangzhou</title>
  <meta name="description" content="杭州地点详情，景点、美食、路线、街区全攻略。">
  <meta name="keywords" content="杭州,杭州地点,杭州景点,杭州美食,iHangzhou">
  <meta name="theme-color" content="#0ea5e9">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="iHangzhou 杭州生活助手">
  <link rel="canonical" href="https://www.ihangzhou.net/place.html">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css?v=20260921a">
  <script src="js/layout.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
  <style>
    .place-hero { position: relative; height: 220px; overflow: hidden; background: #0ea5e9; }
    .place-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .place-hero-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); color: #fff; }
    .place-hero-overlay h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
    .place-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .place-tag { font-size: 11px; background: rgba(255,255,255,0.25); padding: 3px 10px; border-radius: 12px; font-weight: 500; }
    .place-meta { padding: 14px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
    .place-meta-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; color: var(--text-secondary); }
    .place-meta-row .mi { font-size: 16px; width: 20px; text-align: center; }
    .place-meta-row strong { color: var(--text); font-weight: 600; }
    .place-summary { padding: 16px; background: var(--primary); color: #fff; }
    .place-summary p { font-size: 14px; line-height: 1.7; margin: 0; }
    .place-content { padding: 16px; }
    .place-content h2 { font-size: 17px; font-weight: 700; margin: 16px 0 10px; color: var(--text); border-left: 3px solid var(--primary); padding-left: 8px; }
    .place-content p { font-size: 14px; line-height: 1.85; color: var(--text-secondary); margin-bottom: 12px; }
    .place-tips { margin: 16px; padding: 14px; background: var(--bg-alt); border-radius: 10px; border-left: 3px solid var(--primary); }
    .place-tips h3 { font-size: 14px; font-weight: 600; color: var(--primary); margin: 0 0 6px; }
    .place-tips p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin: 0; }
    .place-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }
    .place-action { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500; }
    .place-action:active { transform: scale(0.97); }
    .place-action.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .related-section { padding: 16px; border-top: 8px solid var(--bg-alt); }
    .related-section h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
    .related-list { display: grid; gap: 10px; }
    .related-item { display: flex; gap: 10px; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 10px; text-decoration: none; color: inherit; }
    .related-item img { width: 70px; height: 56px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .related-item-info { flex: 1; min-width: 0; }
    .related-item-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .related-item-summary { font-size: 12px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .place-loading { text-align: center; padding: 80px 16px; color: var(--text-muted); }
    .place-error { text-align: center; padding: 60px 16px; }
    .place-error h1 { font-size: 20px; color: var(--text); margin-bottom: 8px; }
  </style>
</head>
<body>
  <script>
    window.IHZ_PAGE = { title: '杭州地点', icon: '📍', channelId: 'place' };
    window.IZ_SKIP_APP_THEME = true;
    if (window.IZ && IZ.layout) {
      document.addEventListener('DOMContentLoaded', IZ.layout.init);
    }
  </script>

  <div id="placeContainer">
    <div class="place-loading">正在加载地点详情…</div>
  </div>

  <div id="placeData" style="display:none"></div>
  <div id="placeRelated"></div>

  <script src="js/app.js?v=20260928c"></script>
  <script>
    (function () {
      function getParam(name) {
        return new URLSearchParams(location.search).get(name) || '';
      }
      function renderPlace(place) {
        var c = document.getElementById('placeContainer');
        if (!place) {
          c.innerHTML = '<div class="place-error"><h1>未找到地点</h1><p><a href="index.html">返回首页</a></p></div>';
          return;
        }
        var heroImg = place.image || place.cover || '';
        var tags = (place.tags || []).map(function (t) {
          return '<span class="place-tag">' + t + '</span>';
        }).join('');
        var metaRows = [];
        if (place.address) metaRows.push('<div class="place-meta-row"><span class="mi">📍</span><span>' + place.address + '</span></div>');
        if (place.phone) metaRows.push('<div class="place-meta-row"><span class="mi">📞</span><span>' + place.phone + '</span></div>');
        if (place.hours) metaRows.push('<div class="place-meta-row"><span class="mi">🕐</span><span>' + place.hours + '</span></div>');
        if (place.price) metaRows.push('<div class="place-meta-row"><span class="mi">💰</span><span>' + place.price + '</span></div>');
        if (place.rating) metaRows.push('<div class="place-meta-row"><span class="mi">⭐</span><span>评分 <strong>' + place.rating + '</strong></span></div>');

        var html = '';
        if (heroImg) {
          html += '<div class="place-hero"><img src="' + heroImg + '" alt="' + place.name + '"><div class="place-hero-overlay"><h1>' + place.name + '</h1>' + tags + '</div></div>';
        } else {
          html += '<div class="place-hero"><div class="place-hero-overlay"><h1>' + place.name + '</h1>' + tags + '</div></div>';
        }
        if (metaRows.length) html += '<div class="place-meta">' + metaRows.join('') + '</div>';
        if (place.summary) html += '<div class="place-summary"><p>' + place.summary + '</p></div>';
        if (place.content) html += '<div class="place-content">' + place.content + '</div>';
        if (place.tips) html += '<div class="place-tips"><h3>💡 温馨提示</h3><p>' + place.tips + '</p></div>';

        html += '<div class="place-actions">';
        if (place.gmap) html += '<a class="place-action primary" href="' + place.gmap + '" target="_blank" rel="noopener">🗺️ 导航前往</a>';
        if (place.phone) html += '<a class="place-action" href="tel:' + place.phone + '">📞 拨打电话</a>';
        if (place.website) html += '<a class="place-action" href="' + place.website + '" target="_blank" rel="noopener">🌐 官网</a>';
        html += '</div>';
        c.innerHTML = html;
      }

      // 从 cms.json 或内存数据加载
      var placeId = getParam('id') || getParam('name') || '';
      var placeName = getParam('name') || '';

      // 先从 app.js 的全局 PLACES 映射尝试读
      if (window.PLACES_MAP && placeId && window.PLACES_MAP[placeId]) {
        renderPlace(window.PLACES_MAP[placeId]);
      } else if (window.PLACES_MAP && placeName) {
        var found = null;
        for (var k in window.PLACES_MAP) {
          if (window.PLACES_MAP[k].name === placeName) { found = window.PLACES_MAP[k]; break; }
        }
        renderPlace(found);
      } else {
        // 从 cms.json fetch
        fetch('data/cms.json').then(function (r) { return r.json(); }).then(function (data) {
          var places = data.places || data.PLACES || [];
          var map = {};
          places.forEach(function (p) { map[p.id || p.name] = p; });
          window.PLACES_MAP = map;
          if (placeId && map[placeId]) renderPlace(map[placeId]);
          else if (placeName) {
            var f = null;
            for (var k in map) { if (map[k].name === placeName) { f = map[k]; break; } }
            renderPlace(f);
          } else renderPlace(null);
        }).catch(function () { renderPlace(null); });
      }
    })();
  </script>
</body>
</html>
