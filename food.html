    :root{--primary:#d98324;--primary-dark:#b86a1a}
    .sub-page{max-width:720px;margin:0 auto;padding:0 0 40px}
    .sub-hero{background:linear-gradient(135deg,#d98324dd,#b86a1a99);padding:24px 16px 20px;color:#fff;text-align:center}

    .sub-hero h1 .hero-icon{font-size:32px}
    .sub-hero p{font-size:14px;opacity:0.9;line-height:1.6;max-width:480px;margin:0 auto}
    .sub-body{padding:16px;max-width:720px;margin:0 auto}
    .sub-block{margin-bottom:20px}
    .sub-sec-ttl{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:6px;color:var(--text)}
    .sub-third{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(min-width:600px){.sub-third{grid-template-columns:repeat(4,1fr)}}
    .sub-third-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;text-align:center;transition:transform .15s,box-shadow .15s}
    .sub-third-card:active{transform:scale(0.96)}
    .sti{font-size:28px}
    .stn{font-size:13px;color:var(--text);line-height:1.3;font-weight:600}
    .std{font-size:11px;color:var(--text-muted);line-height:1.3}
    .sub-feat{display:flex;flex-direction:column;gap:8px}
    .sub-feat-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:background .15s}
    .sub-feat-card:active{background:var(--bg-hover)}
    .sf-ic{font-size:28px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg-alt);border-radius:10px}
    .sf-bd{flex:1;min-width:0}
    .sf-t{font-size:14px;font-weight:600;color:var(--text)}
    .sf-d{font-size:12px;color:var(--text-muted);display:block;margin-top:2px}
    .sf-ar{font-size:18px;color:var(--text-muted);flex-shrink:0}
    .sub-crumb{padding:12px 16px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--bg-alt)}
    .sub-crumb a{color:var(--primary);text-decoration:none;font-weight:500}
    .sub-crumb b{color:var(--text);font-weight:600}
    .sub-crumb .sep{color:var(--text-muted)}
    .sub-back{display:inline-block;padding:10px 20px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;margin-top:12px}
  </style>

          <a class="sub-third-card" href="breakfast.html"><span class="sti">🥟</span><span class="stn">早餐</span><span class="std">拌面·生煎·小笼</span></a>

            <span class="sf-bd"><span class="sf-t">杭帮菜经典</span><span class="sf-d">西湖醋鱼·龙井虾仁·东坡肉·片儿川</span></span>
            <span class="sf-ar">›</span>

  <script src="js/app.js?v=20261018l"></script>
  <script>
    (function() {
      var KW = ["杭帮菜","西湖醋鱼","龙井虾仁","东坡肉","片儿川","杭州美食","美食"];
      var countEl = document.getElementById('subArtCount');
      var box = document.getElementById('subArts');
      fetch('articles/index.json')
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(function(list) {
          var scored = [];
          list.forEach(function(a) {
            var title = a.title || '', catg = a.cat || '', sum = a.summary || '';
            var sc = 0;
            KW.forEach(function(k) {
              if (title.indexOf(k) >= 0) sc += 3;
              else if (catg.indexOf(k) >= 0) sc += 2;
              else if (sum.indexOf(k) >= 0) sc += 1;
            });
            if (sc > 0) scored.push({ a: a, sc: sc });
          });
          scored.sort(function(x, y) {
            if (y.sc !== x.sc) return y.sc - x.sc;
            return (y.a.words || 0) - (x.a.words || 0);
          });
          var top = scored.slice(0, 12);
          if (countEl) countEl.textContent = top.length ? '共 ' + scored.length + ' 篇匹配' : '';
          if (!top.length) {
            box.innerHTML = '<div class="sub-empty">暂无匹配文章，试试上方子栏目入口</div>';
            return;
          }
          box.innerHTML = top.map(function(o) {
            var a = o.a;
            return '<a class="sub-art" href="articles/' + encodeURIComponent(a.slug) + '.html">' +
              '<span class="sa-t">' + (a.title || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span>' +
              '<span class="sa-m">' + (a.cat || '') + ' · ' + (a.words || 0) + ' 字</span></a>';
          }).join('');
        })
        .catch(function() {
          if (box) box.innerHTML = '<div class="sub-empty">文章加载失败，请稍后重试</div>';
        });
    })();
  </script>
  <script>IZ.layout.init();</script>
