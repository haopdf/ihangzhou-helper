<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="iHangzhou · 文博人文 - 博物馆、历史人文、杭州名人、杭州故事、古镇古建、非遗、寺庙、图书馆一站直达。">
  <meta name="keywords" content="博物馆,历史人文,杭州名人,古镇古建,非遗,寺庙,图书馆">
  <meta name="theme-color" content="#8a6fd6">
  <meta property="og:title" content="文博人文 · iHangzhou">
  <meta property="og:description" content="博物馆、历史人文、杭州名人、杭州故事、古镇古建、非遗、寺庙、图书馆一站直达。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="iHangzhou 杭州生活助手">
  <link rel="manifest" href="manifest.json">
  <title>文博人文 · iHangzhou 杭州生活助手</title>
  <link rel="stylesheet" href="css/style.css?v=20261018l">
  <script src="js/layout.js?v=20261018l"></script>
  <script src="js/breadcrumb.js?v=20261018l"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
  <style>
    :root{--primary:#8a6fd6;--primary-dark:#6b4fc0}
    .sub-page{max-width:720px;margin:0 auto;padding:0 0 40px}
    .sub-hero{background:linear-gradient(135deg,#8a6fd6dd,#6b4fc099);padding:24px 16px 20px;color:#fff;text-align:center}
    .sub-hero h1{font-size:22px;font-weight:700;margin:6px 0 8px;display:flex;align-items:center;justify-content:center;gap:8px}
    .sub-hero h1 .hero-icon{font-size:32px}
    .sub-hero p{font-size:14px;opacity:0.9;line-height:1.6;max-width:480px;margin:0 auto}
    .sub-body{padding:16px;max-width:720px;margin:0 auto}
    .sub-block{margin-bottom:20px}
    .sub-sec-ttl{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:6px;color:var(--text)}
    .sub-third{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(min-width:600px){.sub-third{grid-template-columns:repeat(4,1fr)}}
    .sub-third-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;text-align:center;transition:transform .15s,box-shadow .15s}
    .sub-third-card:active{transform:scale(0.96)}
    .sti{font-size:28px}
    .stn{font-size:13px;color:var(--text);line-height:1.3;font-weight:500}
    .std{font-size:11px;color:var(--text-muted);line-height:1.3}
    .sub-feat{display:flex;flex-direction:column;gap:8px}
    .sub-feat-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;transition:background .15s}
    .sub-feat-card:active{background:var(--bg-hover)}
    .sf-ic{font-size:28px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg-alt);border-radius:10px}
    .sf-bd{flex:1;min-width:0}
    .sf-t{font-size:14px;font-weight:600;color:var(--text)}
    .sf-d{font-size:12px;color:var(--text-muted);display:block;margin-top:2px}
    .sf-ar{font-size:18px;color:var(--text-muted);flex-shrink:0}
    .sub-crumb{padding:12px 16px;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--bg-alt)}
    .sub-crumb a{color:var(--primary);text-decoration:none;font-weight:500}
    .sub-crumb b{color:var(--text);font-weight:600}
    .sub-crumb .sep{color:var(--text-muted)}
    .sub-back{display:inline-block;padding:10px 20px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;margin-top:12px}
    /* 博物馆列表/详情 */
    .mu-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media(min-width:600px){.mu-cards{grid-template-columns:repeat(3,1fr)}}
    .mu-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:14px;text-decoration:none;text-align:center;transition:transform .15s}
    .mu-card:active{transform:scale(0.96)}
    .mu-card-ico{font-size:36px}
    .mu-card-name{font-size:14px;font-weight:600;color:var(--text)}
    .mu-card-desc{font-size:11px;color:var(--text-muted);line-height:1.3}
    .mu-detail{max-width:720px;margin:0 auto}
    .mu-d-hero{background:linear-gradient(135deg,#8a6fd6,#6b4fc0);color:#fff;padding:28px 16px 24px;text-align:center}
    .mu-d-hero h1{font-size:22px;font-weight:700;margin:8px 0 4px}
    .mu-d-hero-sub{font-size:14px;opacity:0.9}
    .mu-d-body{padding:16px}
    .mu-d-sec{padding:14px;background:var(--bg-card);border-radius:12px;margin-bottom:12px}
    .mu-d-sec h3{font-size:15px;font-weight:600;margin:0 0 8px}
    .mu-d-sec p,.mu-d-sec li{font-size:13px;color:var(--text-secondary);line-height:1.7}
  </style>
</head>
<body>
  <script>
    window.IHZ_PAGE = { title: '文博人文', icon: '🏛️' };
    window.IZ_SKIP_APP_INIT = true;
  </script>

  <div class="page active" id="pageSub">
    <!-- 面包屑 -->
    <div class="sub-crumb" id="muCrumb">
      <a href="index.html">首页</a>
      <span class="sep">/</span>
      <b>文博人文</b>
    </div>

    <!-- Hero -->
    <div class="sub-hero">
      <h1><span class="hero-icon">🏛️</span> 文博人文</h1>
      <p>博物馆 · 历史人文 · 杭州名人 · 杭州故事 · 古镇古建 · 非遗 · 寺庙 · 图书馆</p>
    </div>

    <!-- 主体内容 -->
    <div class="sub-body" id="muContent"></div>

    <div style="padding:0 16px;text-align:center">
      <a href="index.html" class="sub-back">← 返回首页</a>
    </div>
  </div>

  <script src="js/museum-data.js"></script>
  <script>
    (function() {
      var DATA = window.MUSEUM_DATA || {};
      var params = new URLSearchParams(location.search);
      var detailId = params.get('id');
      var sublist = params.get('sublist');
      var content = document.getElementById('muContent');
      var crumb = document.getElementById('muCrumb');

      // 详情视图
      if (detailId && DATA[detailId]) {
        var data = DATA[detailId];
        document.title = data.name + ' · 博物馆 · 文博人文 · iHangzhou';
        crumb.innerHTML = '<a href="index.html">首页</a><span class="sep">/</span><a href="bowuguan.html">文博人文</a><span class="sep">/</span><a href="bowuguan.html?sublist=museum">博物馆</a><span class="sep">/</span><b>' + data.name + '</b>';
        var h = '<div class="mu-detail"><div class="mu-d-hero">';
        h += '<h1>' + data.name + '</h1>';
        h += '<div class="mu-d-hero-sub">' + (data.subtitle || '') + '</div></div>';
        h += '<div class="mu-d-body">';
        if (data.open_time) {
          h += '<div class="mu-d-sec">🕐 开放时间：' + data.open_time + '</div>';
        }
        if (data.history) {
          h += '<div class="mu-d-sec"><h3>📖 博物馆介绍</h3><p>' + data.history + '</p></div>';
        }
        if (data.features && data.features.length) {
          h += '<div class="mu-d-sec"><h3>✨ 特色看点</h3><ul style="padding-left:20px;margin:0">';
          data.features.forEach(function(f){ h += '<li>' + f + '</li>'; });
          h += '</ul></div>';
        }
        if (data.spots && data.spots.length) {
          h += '<div class="mu-d-sec"><h3>📍 场馆信息</h3>';
          data.spots.forEach(function(s){
            h += '<div style="padding:8px 0;border-bottom:1px solid var(--border-light)"><div style="font-size:13px;font-weight:600;margin-bottom:2px">' + s.n + '</div>';
            if (s.d) h += '<div style="font-size:11px;color:var(--text-muted)">' + s.d + '</div>';
            h += '</div>';
          });
          h += '</div>';
        }
        h += '<a href="bowuguan.html?sublist=museum" class="sub-back">← 返回博物馆列表</a>';
        h += '</div></div>';
        content.outerHTML = h;
        return;
      }

      // 博物馆子列表视图
      if (sublist === 'museum') {
        var keys = Object.keys(DATA);
        document.title = '博物馆 · 文博人文 · iHangzhou';
        crumb.innerHTML = '<a href="index.html">首页</a><span class="sep">/</span><a href="bowuguan.html">文博人文</a><span class="sep">/</span><b>博物馆</b>';
        var h = '<h3 style="font-size:15px;font-weight:600;margin:0 0 14px">🏛️ 全部博物馆 <span style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:8px">' + keys.length + ' 座</span></h3>';
        h += '<div class="mu-cards">';
        keys.forEach(function(k) {
          var v = DATA[k];
          h += '<a class="mu-card" href="bowuguan.html?id=' + k + '">';
          h += '<div class="mu-card-ico">🏛️</div>';
          h += '<div class="mu-card-name">' + v.name + '</div>';
          h += '<div class="mu-card-desc">' + v.subtitle + '</div></a>';
        });
        h += '</div>';
        content.innerHTML = h;
        return;
      }

      // 默认视图：8 个子分类
      document.title = '文博人文 · iHangzhou';
      var subs = [
        { k: 'museum', ic: '🏛️', n: '博物馆', d: '浙江省博物馆 · 丝绸 · 茶叶 · 良渚', url: 'bowuguan.html?sublist=museum' },
        { k: 'lishi', ic: '📜', n: '历史人文', d: '南宋史 · 运河史 · 城防与民居', url: 'history.html' },
        { k: 'mingren', ic: '👤', n: '杭州名人', d: '白居易 · 苏轼 · 岳飞 · 李清照', url: 'celebrity.html' },
        { k: 'guzhen', ic: '🏯', n: '古镇古建', d: '乌镇 · 南塘 · 历史建筑保护', url: 'guzhen.html' },
        { k: 'gujian', ic: '🏚️', n: '古镇古建', gushi: '杭州故事', d: '典故 · 民间故事 · 文学记忆', url: 'story.html' },
        { k: 'feiyi', ic: '🎭', n: '非遗', d: '西湖绸伞 · 杭绣 · 龙井制茶', url: 'intangible.html' },
        { k: 'simiao', ic: '⛩️', n: '寺庙', d: '灵隐 · 净慈 · 三天竺', url: 'temple.html' },
        { k: 'tushuguan', ic: '📚', n: '图书馆', d: '浙江图书馆 · 杭州图书馆', url: 'tushuguan.html' }
      ];

      // 子栏目区
      var sec = document.createElement('div');
      sec.className = 'sub-block';
      sec.innerHTML = '<div class="sub-sec-ttl">📂 全部栏目 <span style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:auto">8 个</span></div>';
      var grid = document.createElement('div');
      grid.className = 'sub-third';
      subs.forEach(function(s) {
        var url = s.url || ('bowuguan.html?sublist=' + s.k);
        var a = document.createElement('a');
        a.className = 'sub-third-card';
        a.href = url;
        a.innerHTML = '<span class="sti">' + s.ic + '</span><span class="stn">' + s.n + '</span><span class="std">' + s.d + '</span>';
        grid.appendChild(a);
      });
      sec.appendChild(grid);
      content.appendChild(sec);

      // 精选入口
      var feat = document.createElement('div');
      feat.className = 'sub-block';
      feat.innerHTML = '<div class="sub-sec-ttl">⭐ 热门入口</div>';
      var featWrap = document.createElement('div');
      featWrap.className = 'sub-feat';
      [
        { ic: '🏛️', t: '浙江省博物馆', d: '免费，孤山馆区与武林馆区', url: 'bowuguan.html?id=zjbwg' },
        { ic: '📜', t: '南宋历史', d: '南宋定都杭州的不解之缘', url: 'history.html' },
        { ic: '⛩️', t: '灵隐寺', d: '千年古刹，禅宗圣地', url: 'temple.html' }
      ].forEach(function(f) {
        var a = document.createElement('a');
        a.className = 'sub-feat-card';
        a.href = f.url;
        a.innerHTML = '<span class="sf-ic">' + f.ic + '</span><span class="sf-bd"><span class="sf-t">' + f.t + '</span><span class="sf-d">' + f.d + '</span></span><span class="sf-ar">›</span>';
        featWrap.appendChild(a);
      });
      feat.appendChild(featWrap);
      content.appendChild(feat);
    })();
  </script>
  <script src="js/app.js?v=20261018l"></script>
  <script>IZ.layout.init();</script>
</body>
</html>
