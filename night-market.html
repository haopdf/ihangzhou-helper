<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>杭州夜市 · iHangzhou</title>
  <meta name="theme-color" content="#1f7a5a">
  <meta name="description" content="杭州夜宵夜市地图：河坊街、武林夜市、滨江星光、下沙夜市、千岛湖鱼街">
  <link rel="stylesheet" href="css/style.css?v=20261018b">
  <script src="js/layout.js?v=20261016e"></script>
  <script src="js/night-market-data.js"></script>
  <style>
:root{--primary:#7c2d12;--primary-dark:#451a03;}
    .p-hero{position:relative;width:100%;height:200px;overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
    .p-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.55))}
    .p-hero .p-hero-inner{position:absolute;bottom:0;left:0;right:0;padding:16px;z-index:2;color:#fff}
    .p-hero .p-hero-title{font-size:24px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.5)}
    .p-hero .p-hero-sub{font-size:13px;opacity:.92;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
    .p-body{padding:16px}
    .p-badge{display:inline-block;font-size:12px;padding:4px 10px;background:#fef2f2;color:var(--primary);border-radius:10px;font-weight:600;margin-bottom:8px}
    .p-infogrid{display:flex;flex-direction:column;gap:0;border:1px solid var(--border-light);border-radius:10px;overflow:hidden;margin:12px 0}
    .p-inforow{display:flex;padding:10px 12px;border-bottom:1px solid var(--border-light);background:var(--bg-card)}
    .p-inforow:last-child{border-bottom:none}
    .p-inforow .gk{font-size:12px;font-weight:600;color:var(--text-secondary);min-width:56px;flex-shrink:0}
    .p-inforow .gv{font-size:13px;color:var(--text)}
    .p-section{margin:20px 0 8px}
    .p-section h3{font-size:16px;font-weight:700;margin:0 0 10px;padding-left:8px;border-left:3px solid var(--primary)}
    .p-feat{display:flex;flex-direction:column;gap:6px}
    .p-feat i{font-size:13px;color:var(--text);padding:8px 12px;background:var(--bg);border-radius:8px;display:flex;gap:8px;line-height:1.5}
    .p-feat i::before{content:'\2713';color:var(--primary);font-weight:700;flex-shrink:0;margin-top:1px}
    .p-cards{display:flex;flex-direction:column;gap:8px}
    .p-card{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg-card);border-radius:10px;border:1px solid var(--border-light)}
    .p-card .p-card-ico{font-size:22px;flex-shrink:0}
    .p-card .p-card-name{font-size:14px;font-weight:600;color:var(--text)}
    .p-card .p-card-desc{font-size:12px;color:var(--text-secondary);margin-top:2px}
    .p-neighbors{margin-top:24px;border-top:8px solid var(--bg);padding-top:16px}
    .p-neighbors h3{font-size:15px;font-weight:700;margin:0 0 12px}
    .p-neighbor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .p-neighbor{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg);border-radius:8px;text-decoration:none;color:var(--text);font-size:13px;font-weight:500}
    .p-neighbor:active{opacity:.7}
    .p-empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
    .p-empty .p-hero-icon{font-size:64px;margin-bottom:16px}
    @media(min-width:768px){.p-hero{height:300px}.p-hero-inner{max-width:1180px;margin:0 auto}.p-body{max-width:1180px;margin:0 auto}}
  </style>
<link rel="stylesheet" href="css/channel.css?v=20261018a">
</head>
<body>
  <script>window.IHZ_PAGE={title:'夜市',icon:'🌃'};window.IZ_SKIP_APP_INIT=true;window.IZ_SKIP_APP_THEME=true;</script>
  <div id="nightMarketContainer"><div class="p-empty"><div class="p-hero-icon">🌃</div><h2>加载中...</h2></div></div>
  <script>
    function renderNightMarket(id){
      var data=window.NIGHTMARKET_DATA?window.NIGHTMARKET_DATA[id]:null;
      var c=document.getElementById('nightMarketContainer');
      var ht=document.getElementById('headerTitle');
      if(!data){c.innerHTML='<div class="p-empty"><div class="p-hero-icon">�</div><h2>未找到</h2><a href="cat.html?c=food&s=%E5%A4%9C%E5%B8%82" class="btn" style="display:inline-block;padding:10px 20px;background:#7c2d12;color:#fff;border-radius:8px;text-decoration:none;font-size:14px">← 返回</a> <a href="food.html" class="btn" style="display:inline-block;padding:10px 20px;background:var(--primary);color:#fff;border-radius:8px;text-decoration:none;font-size:14px;margin-left:8px">美食首页</a></div>';if(ht)ht.textContent='🌃 夜市';return;}
      document.title=data.name+' · 夜市 · iHangzhou';
      if(ht)ht.textContent='🌃 '+data.name;
      var h='<div class="p-hero"><div class="p-hero-inner"><div class="p-hero-title">'+data.name+'</div><div class="p-hero-sub">'+data.subtitle+'</div></div></div><div class="p-body">';
      h+='<div class="p-badge">'+data.badge+' '+data.name+'</div><div style="clear:both"></div>';
      h+='<div class="p-infogrid">';
      if(data.address)h+='<div class="p-inforow"><span class="gk">📍</span><span class="gv">'+data.address+'</span></div>';
      if(data.time)h+='<div class="p-inforow"><span class="gk">�</span><span class="gv">'+data.time+'</span></div>';
      h+='</div>';
      if(data.history)h+='<div style="margin:12px 0;padding:12px;background:#fef2f2;border-radius:10px;border-left:3px solid #7c2d12"><p style="font-size:13px;color:var(--text-secondary);line-height:1.7;margin:0">📜 '+data.history+'</p></div>';
      if(data.features&&data.features.length){h+='<div class="p-section"><h3>✨ 特色</h3><div class="p-feat">';data.features.forEach(function(f){h+='<i>'+f+'</i>'});h+='</div></div>';}
      if(data.food&&data.food.length){h+='<div class="p-section"><h3>🍢 必吃</h3><div class="p-cards">';data.food.forEach(function(f){h+='<div class="p-card"><span class="p-card-ico">🍜</span><div><div class="p-card-name">'+f.n+'</div><div class="p-card-desc">'+f.d+'</div></div></div>'});h+='</div></div>';}
      var keys=window.NIGHTMARKET_DATA?Object.keys(window.NIGHTMARKET_DATA):[];
      var nb=keys.filter(function(k){return k!==id}).slice(0,4);
      if(nb.length){h+='<div class="p-neighbors"><h3>🌃 更多夜市</h3><div class="p-neighbor-grid">';nb.forEach(function(k){var v=window.NIGHTMARKET_DATA[k];h+='<a class="p-neighbor" href="night-market.html?id='+k+'"><span>'+v.badge+'</span><span>'+v.name+'</span></a>'});h+='</div></div>';}
      h+='<div style="margin-top:24px;display:flex;gap:10px"><a href="cat.html?c=food&s=%E5%A4%9C%E5%B8%82" style="flex:1;text-align:center;padding:12px;background:#7c2d12;color:#fff;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600">← 夜市频道</a><a href="food.html" style="flex:1;text-align:center;padding:12px;background:var(--primary);color:#fff;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600">美食首页</a></div>';
      h+='</div>';c.innerHTML=h;
    }
    (function(){var id=(location.search.split('id=')[1]||'').split('&')[0];renderNightMarket(decodeURIComponent(id))})();
  </script>
  <script>if(window.IZ&&IZ.layout){document.addEventListener('DOMContentLoaded',IZ.layout.init)}</script>
</body>
</html>
